    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#0a0a12;--bg2:#14141f;--bg3:rgba(255,255,255,0.035);
      --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
      --text:#eef0f7;--text2:#5a6a7e;--text3:#b0bec5;
      --accent:#6366f1;--accent2:#14b8a6;
      --shadow:0 8px 28px rgba(0,0,0,0.28);
    }
    body.light{
      --bg:#f5f6fb;--bg2:#ffffff;--bg3:rgba(15,15,35,0.025);
      --border:rgba(15,15,35,0.08);--border2:rgba(15,15,35,0.13);
      --text:#171726;--text2:#64748b;--text3:#475569;
      --shadow:0 8px 28px rgba(20,20,40,0.08);
    }
    body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;min-height:100vh;transition:background 0.3s,color 0.3s;letter-spacing:-0.01em;}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(99,102,241,0.07) 0%,transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%,rgba(20,184,166,0.06) 0%,transparent 60%);
    }
    body.light::before{
      background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(99,102,241,0.07) 0%,transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%,rgba(20,184,166,0.07) 0%,transparent 60%);
    }
    #root{position:relative;z-index:1;}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes cfFall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
    ::-webkit-scrollbar{width:6px;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:10px;}
    body.light ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);}
    button{font-family:inherit;}
    input{font-family:inherit;}
    .input-field { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: var(--accent); }
    .btn-primary { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; transition: opacity 0.2s; margin-bottom: 12px; }
    .btn-primary:hover { opacity: 0.9; }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
    .subTab { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .subTab:hover { border-color: var(--border2); color: var(--text); }
  </style>
</head>

// ── DOM HELPERS ───────────────────────────────────────────────
function elSet(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

function barSet(id, pct, background) {
  const el = document.getElementById(id);
  if (el) {
    el.style.width = pct + "%";
    el.style.background = background;
  }
}

// ── RENDER TOPICS ─────────────────────────────────────────────
function renderTopics() {
  const container = document.getElementById("topicsContainer");
  if (!container) return;

  const topics = TOPICS[activeSub] || [];
  const color = SUBJECTS[activeSub].color;

  container.innerHTML = topics.map((t, i) => {
    const key = activeSub + ":" + i;
    const isDone = !!userData.done[key];
    
    return `
      <div onclick="toggleTopic('${activeSub}', ${i})" 
           style="padding:14px; margin-bottom:8px; border-radius:10px; cursor:pointer; 
                  border:1px solid ${isDone ? color : 'var(--border)'}; 
                  background:${isDone ? color + '15' : 'var(--bg2)'}; 
                  display:flex; justify-content:space-between; align-items:center;
                  transition:all 0.2s;">
        <span style="color:${isDone ? 'var(--text)' : 'var(--text2)'}; 
                     text-decoration:${isDone ? 'line-through' : 'none'};
                     font-weight:${isDone ? '600' : '500'};">${t}</span>
        <span style="color:${isDone ? color : 'var(--text3)'}; font-size:1.2rem;">
          ${isDone ? '✅' : '○'}
        </span>
      </div>
    `;
  }).join("");
}
