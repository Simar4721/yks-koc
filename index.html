<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKS Koçum - YKS Hazırlık Ve Takip Asistanı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDK Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      onSnapshot, 
      updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- Firebase Konfigürasyonu ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // --- Uygulama State Yönetimi ---
    const AppState = {
      user: null,
      userData: {
        targetUniversity: "",
        targetDepartment: "",
        examType: "TYT-AYT",
        todos: [],
        examResults: [],
        notes: ""
      },
      activeTab: "dashboard",
      unsubscribeFirestore: null
    };

    // State Güncelleme ve UI Senkronizasyonu
    function setState(newState) {
      Object.assign(AppState, newState);
      renderUI();
    }

    // --- Veritabanı İşlemleri ---
    async function initUserFirestore(user) {
      if (!user) return;
      const userDocRef = doc(db, "users", user.uid);

      // Eski dinleyici varsa temizle (Çift tetiklemeyi önler)
      if (AppState.unsubscribeFirestore) {
        AppState.unsubscribeFirestore();
      }

      try {
        const docSnap = await getDoc(userDocRef);
        if (!docSnap.exists()) {
          // Yeni kullanıcı varsayılan verileri
          await setDoc(userDocRef, AppState.userData);
        }

        // Anlık Veri Dinleyicisi
        const unsubscribe = onSnapshot(userDocRef, (snapshot) => {
          if (snapshot.exists()) {
            AppState.userData = snapshot.data();
            renderUI();
          }
        }, (error) => {
          console.error("Firestore dinleme hatası:", error);
        });

        AppState.unsubscribeFirestore = unsubscribe;
      } catch (error) {
        console.error("Veritabanı başlatma hatası:", error);
      }
    }

    async function syncToFirestore() {
      if (!AppState.user) return;
      try {
        const userDocRef = doc(db, "users", AppState.user.uid);
        await updateDoc(userDocRef, AppState.userData);
      } catch (error) {
        console.error("Veri senkronizasyon hatası:", error);
      }
    }

    // --- Auth İşlemleri ---
    window.handleLogin = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        alert("Giriş yapılırken bir hata oluştu: " + error.message);
      }
    };

    window.handleLogout = async () => {
      try {
        if (AppState.unsubscribeFirestore) {
          AppState.unsubscribeFirestore();
        }
        await signOut(auth);
        setState({
          user: null,
          userData: { targetUniversity: "", targetDepartment: "", examType: "TYT-AYT", todos: [], examResults: [], notes: "" },
          unsubscribeFirestore: null
        });
      } catch (error) {
        alert("Çıkış yapılırken bir hata oluştu: " + error.message);
      }
    };

    // Auth Durum Dinleyicisi
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        AppState.user = user;
        await initUserFirestore(user);
      } else {
        AppState.user = null;
      }
      renderUI();
    });

    // --- İş Mantığı (Actions) ---
    window.switchTab = (tabName) => {
      AppState.activeTab = tabName;
      renderUI();
    };

    window.addTodo = async (event) => {
      event.preventDefault();
      const input = document.getElementById("todo-input");
      const text = input.value.trim();
      if (!text) return;

      const newTodo = { id: Date.now(), text, completed: false };
      AppState.userData.todos.push(newTodo);
      input.value = "";
      
      renderUI();
      await syncToFirestore();
    };

    window.toggleTodo = async (id) => {
      AppState.userData.todos = AppState.userData.todos.map(t => 
        t.id === id ? { ...t, completed: !t.completed } : t
      );
      renderUI();
      await syncToFirestore();
    };

    window.deleteTodo = async (id) => {
      AppState.userData.todos = AppState.userData.todos.filter(t => t.id !== id);
      renderUI();
      await syncToFirestore();
    };

    window.addExamResult = async (event) => {
      event.preventDefault();
      const name = document.getElementById("exam-name").value;
      const net = parseFloat(document.getElementById("exam-net").value);

      if (!name || isNaN(net)) return;

      AppState.userData.examResults.push({ id: Date.now(), name, net, date: new Date().toLocaleDateString("tr-TR") });
      document.getElementById("exam-form").reset();

      renderUI();
      await syncToFirestore();
    };

    // --- UI Render İşlemleri ---
    function renderUI() {
      const appDiv = document.getElementById("app");

      if (!AppState.user) {
        appDiv.innerHTML = `
          <div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
              <div class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fa-solid fa-graduation-cap"></i>
              </div>
              <h1 class="text-2xl font-bold text-gray-800 mb-2">YKS Koçum'a Hoş Geldiniz</h1>
              <p class="text-gray-600 mb-6 text-sm">Hedeflerinize giden yolda çalışma takibinizi ve deneme netlerinizi tek noktadan yönetin.</p>
              <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-brands fa-google"></i> Google ile Giriş Yap
              </button>
            </div>
          </div>
        `;
        return;
      }

      appDiv.innerHTML = `
        <div class="min-h-screen bg-gray-50 flex flex-col md:flex-row">
          <!-- Sol Sidebar -->
          <aside class="w-full md:w-64 bg-slate-900 text-white p-5 flex flex-col justify-between">
            <div>
              <div class="flex items-center gap-3 mb-8">
                <i class="fa-solid fa-graduation-cap text-2xl text-blue-400"></i>
                <span class="font-bold text-xl tracking-wide">YKS Koçum</span>
              </div>
              <nav class="space-y-2">
                <button onclick="switchTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left transition ${AppState.activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}">
                  <i class="fa-solid fa-chart-line"></i> Genel Bakış
                </button>
                <button onclick="switchTab('todos')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left transition ${AppState.activeTab === 'todos' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}">
                  <i class="fa-solid fa-list-check"></i> Görevlerim
                </button>
                <button onclick="switchTab('exams')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left transition ${AppState.activeTab === 'exams' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}">
                  <i class="fa-solid fa-pen-ruler"></i> Deneme Takibi
                </button>
              </nav>
            </div>
            
            <div class="pt-6 border-t border-slate-800 flex items-center justify-between">
              <div class="flex items-center gap-3 overflow-hidden">
                <img src="${AppState.user.photoURL || 'https://via.placeholder.com/40'}" class="w-9 h-9 rounded-full object-cover" alt="Profil">
                <div class="truncate">
                  <p class="text-sm font-medium text-white truncate">${AppState.user.displayName}</p>
                  <p class="text-xs text-slate-400 truncate">${AppState.user.email}</p>
                </div>
              </div>
              <button onclick="handleLogout()" title="Çıkış Yap" class="text-slate-400 hover:text-red-400 p-2 transition">
                <i class="fa-solid fa-right-from-bracket"></i>
              </button>
            </div>
          </aside>

          <!-- Ana İçerik Alanı -->
          <main class="flex-1 p-6 md:p-10 overflow-y-auto">
            ${renderMainContent()}
          </main>
        </div>
      `;

      if (AppState.activeTab === 'exams') {
        renderChart();
      }
    }

    function renderMainContent() {
      if (AppState.activeTab === 'dashboard') {
        const completedCount = AppState.userData.todos.filter(t => t.completed).length;
        const totalCount = AppState.userData.todos.length;

        return `
          <div class="max-w-4xl space-y-6">
            <h2 class="text-2xl font-bold text-gray-800">Hoş Geldin, ${AppState.user.displayName} 👋</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500 mb-1">Tamamlanan Görevler</p>
                <p class="text-3xl font-bold text-gray-800">${completedCount} / ${totalCount}</p>
              </div>
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500 mb-1">Girilen Deneme</p>
                <p class="text-3xl font-bold text-gray-800">${AppState.userData.examResults.length}</p>
              </div>
              <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500 mb-1">Hedef Bölüm</p>
                <p class="text-xl font-bold text-blue-600 truncate">${AppState.userData.targetDepartment || 'Henüz Belirtilmedi'}</p>
              </div>
            </div>
          </div>
        `;
      }

      if (AppState.activeTab === 'todos') {
        return `
          <div class="max-w-2xl space-y-6">
            <h2 class="text-2xl font-bold text-gray-800">Çalışma Listesi</h2>
            <form onsubmit="addTodo(event)" class="flex gap-2">
              <input type="text" id="todo-input" placeholder="Yeni çalışma görevi ekle..." required class="flex-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
              <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-xl hover:bg-blue-700 transition">Ekle</button>
            </form>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 divide-y">
              ${AppState.userData.todos.length === 0 ? '<p class="p-4 text-center text-gray-400">Henüz eklenmiş bir görev bulunmuyor.</p>' : ''}
              ${AppState.userData.todos.map(todo => `
                <div class="p-4 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id})" class="w-5 h-5 accent-blue-600 rounded cursor-pointer">
                    <span class="${todo.completed ? 'line-through text-gray-400' : 'text-gray-700'}">${todo.text}</span>
                  </div>
                  <button onclick="deleteTodo(${todo.id})" class="text-red-500 hover:text-red-700 text-sm">Sil</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (AppState.activeTab === 'exams') {
        return `
          <div class="max-w-3xl space-y-6">
            <h2 class="text-2xl font-bold text-gray-800">Deneme Takibi</h2>
            
            <form id="exam-form" onsubmit="addExamResult(event)" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex gap-4">
              <input type="text" id="exam-name" placeholder="Deneme Adı (Örn: Özdebir 1)" required class="flex-1 px-4 py-2 border rounded-xl">
              <input type="number" step="0.25" id="exam-net" placeholder="Toplam Net" required class="w-32 px-4 py-2 border rounded-xl">
              <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-xl hover:bg-blue-700 transition">Kaydet</button>
            </form>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
              <canvas id="examChart" class="max-h-80"></canvas>
            </div>
          </div>
        `;
      }
    }

    function renderChart() {
      const ctx = document.getElementById('examChart');
      if (!ctx) return;

      const labels = AppState.userData.examResults.map(e => e.name);
      const data = AppState.userData.examResults.map(e => e.net);

      new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Deneme Netleri',
            data,
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }
  </script>
</head>
<body class="bg-gray-50 font-sans antialiased">
  <div id="app">
    <!-- Sayfa Yüklenme Durumu -->
    <div class="min-h-screen flex items-center justify-center">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
    </div>
  </div>
</body>
</html>
