  {min:100, name:"Azimli Öğrenci",    next:250},

const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
function todayKeyForDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function daysTo(d){ return Math.max(0, Math.ceil((d - Date.now()) / 86400000)); }
function todayStr(){ return new Date().toDateString(); }
function escapeHtml(value){ return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
function countStreak(streak){
  if(!streak||!streak.length) return 0;
  let c=0, d=new Date();
  while(streak.includes(d.toDateString())&&c<400){ c++; d.setDate(d.getDate()-1); }
  return c;
}
function calcStats(){
  let tD=0,tT=0,aD=0,aT=0;
  Object.entries(TOPICS).forEach(([s,topics])=>{
    const isTyt=SUBJECTS[s].type==="tyt";
    topics.forEach((_,i)=>{ if(isTyt){tT++; if(userData.done[s+":"+i])tD++;} else{aT++; if(userData.done[s+":"+i])aD++;} });
  });
  return{tD,tT,aD,aT,total:tD+aD,all:tT+aT};
}
function getLevel(xp){
  let lvl=LEVELS[0],idx=0;
  for(let i=LEVELS.length-1;i>=0;i--){ if(xp>=LEVELS[i].min){lvl=LEVELS[i];idx=i;break;} }
  const next=LEVELS[Math.min(idx+1,LEVELS.length-1)];
  const pct=idx===LEVELS.length-1?100:Math.round((xp-lvl.min)/(next.min-lvl.min)*100);
  return{lvl,idx,next,pct};
}
function fmtTime(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function todayTotalStudy(){ return (userData.studySeconds||{})[todayKey()] || 0; }

  } else {
    userData = { done:{}, xp:0, streak:[], name: currentUser.displayName||"", studySeconds:{}, exams:[], weeklyGoalHours:8, streakRecord:0 };
  }

function scheduleSave(){
  if(saveTimeout) clearTimeout(saveTimeout);
  const uid = currentUser?.uid;
  const snapshot = JSON.parse(JSON.stringify(userData));
  saveTimeout = setTimeout(async ()=>{
    if(!uid || !currentUser || currentUser.uid !== uid) return;
    await setDoc(doc(db,"users",uid), snapshot, {merge:false});
  }, 1200);
}

function timerCurrentSec(){ return (timerRunning && timerStart) ? timerElapsed + Math.floor((Date.now()-timerStart)/1000) : timerElapsed; }
function timerTick(){
  const sec = timerCurrentSec();
  const el = document.getElementById("timerDisplay");
  if(el) el.textContent = fmtTime(sec);
  const tot = document.getElementById("timerTodayTotal");
  if(tot) tot.textContent = fmtTime(todayTotalStudy() + (timerRunning ? Math.floor((Date.now()-timerStart)/1000) : 0));
}
function timerStartStop(){
  if(!timerRunning){
    timerStart = Date.now(); timerRunning = true; timerInterval = setInterval(timerTick, 1000);
    const t=todayStr();
    if(!userData.streak) userData.streak=[];
    if(!userData.streak.includes(t)){ userData.streak.push(t); updateStreakRecord(); scheduleSave(); }
    const btn = document.getElementById("timerBtn");
    if(btn){ btn.textContent="⏸ Durdur"; btn.style.background="#ff4757"; }
    const dot = document.getElementById("timerDot");
    if(dot) dot.style.animation="pulse 1s infinite";
  } else {
    const elapsed = Math.floor((Date.now()-timerStart)/1000);
    timerElapsed += elapsed;
    if(!userData.studySeconds) userData.studySeconds={};
    userData.studySeconds[todayKey()] = (userData.studySeconds[todayKey()]||0) + elapsed;
    timerStart = null; timerRunning = false; clearInterval(timerInterval); scheduleSave();
    const btn = document.getElementById("timerBtn");
    if(btn){ btn.textContent="▶ Başlat"; btn.style.background="#2ed573"; }
    const dot = document.getElementById("timerDot");
    if(dot) dot.style.animation="none";
    timerTick();
  }
}
function timerReset(){
  if(timerRunning){ clearInterval(timerInterval); timerRunning=false; timerStart=null; timerInterval=null; }
  timerElapsed=0;
  const btn=document.getElementById("timerBtn");
  if(btn){ btn.textContent="▶ Başlat"; btn.style.background="#2ed573"; }
  const dot=document.getElementById("timerDot");
  if(dot) dot.style.animation="none";
  timerTick();
}

function weekStudySeconds(){
  let total=0;
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    total+=((userData.studySeconds||{})[todayKeyForDate(d)]||0);
  }
  return total;
}
function updateStreakRecord(){
  const cur=countStreak(userData.streak||[]);
  if(cur>(userData.streakRecord||0)){ userData.streakRecord=cur; }
}

function toggleTopic(subj,i){
  const key=subj+":"+i;
  const wasDone=!!userData.done[key];
  const xpAmt=SUBJECTS[subj].xp;
  userData.done[key]=!wasDone;
  const t=todayStr();
  if(!userData.streak) userData.streak=[];
  if(!userData.streak.includes(t)) userData.streak.push(t);
  updateStreakRecord();
  if(!wasDone){
    userData.xp+=xpAmt;
    const s=calcStats(); const p=s.total/s.all;
    let em="✅",ti="KONU TAMAM!",tx="Harika! Bir adım daha attın. Devam et!";
    if(s.total===1){em="⭐";ti="İLK ADIM!";tx="İlk konunu tamamladın. Her büyük yolculuk bir adımla başlar.";}
    else if(s.total===5){em="🔥";ti="MOMENTUM!";tx="5 konu bitti! Ateş yanıyor, durma.";}
    else if(p>=1){em="🏆";ti="EFSANE!";tx="Tüm konuları tamamladın. Sen artık başka birisin.";}
    showReward(em,ti,tx,xpAmt);
  } else { userData.xp=Math.max(0,userData.xp-xpAmt); }
  scheduleSave(); renderTopics(); renderStats(); renderDonutSection();
}

function buildStreakRow(){

  for(let i=0;i<7;i++){

    const div=document.createElement("div");
    div.style.cssText=`width:32px;height:32px;border-radius:6px;display:flex;align-items:center;
      justify-content:center;font-family:monospace;font-size:0.65rem;font-weight:600;

        if(!name.toLowerCase().includes(searchQuery)) return;

        list.innerHTML += `<div onclick="toggleTopic('${subKey}',${i})" style="display:flex;align-items:center;gap:10px;

function attachNav(active){
  const nav=document.getElementById("mainNav");
  if(!nav) return;
  const pages=[["dashboard","📊 Panel"],["topics","📚 Konular"],["exams","📝 Denemeler"],["profile","👤 Profil"]];
  if(isAdmin()) pages.push(["admin","🛡 Admin"]);
  pages.forEach(([p,label])=>{
    const btn=document.createElement("button");
    const isActive=active===p;
    btn.style.cssText=`background:${isActive?"var(--bg3)":"transparent"};
      border:1px solid ${isActive?"var(--accent)":"var(--border)"};
      color:${isActive?"var(--accent)":"var(--text2)"};
      padding:8px 18px;border-radius:8px;font-family:monospace;font-size:0.72rem;cursor:pointer;letter-spacing:1px;`;
    btn.textContent=label; btn.onclick=()=>setPage(p); nav.appendChild(btn);
  });
  const themeBtn=document.createElement("button");
  themeBtn.id="themeBtn";
  themeBtn.style.cssText=`background:transparent;border:1px solid var(--border);color:var(--text2);padding:8px 12px;border-radius:8px;font-size:0.85rem;cursor:pointer;`;
  themeBtn.textContent=isDark?"☀️":"🌙"; themeBtn.onclick=toggleTheme; nav.appendChild(themeBtn);
  
  const logoutBtn=document.createElement("button");
  logoutBtn.style.cssText="background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);color:#ff4757;padding:8px 18px;border-radius:8px;font-family:monospace;font-size:0.72rem;cursor:pointer;letter-spacing:1px;margin-left:auto;";
  logoutBtn.textContent="Çıkış"; logoutBtn.onclick=doLogout; nav.appendChild(logoutBtn);
}
function toggleTheme(){
  isDark=!isDark;
  if(isDark){ document.body.classList.remove("light"); localStorage.setItem("theme","dark"); document.getElementById("themeBtn").textContent="☀️"; }
  else{ document.body.classList.add("light"); localStorage.setItem("theme","light"); document.getElementById("themeBtn").textContent="🌙"; }
}
function isAdmin(){ return currentUser?.email==="cayan@example.com" || currentUser?.email==="admin@example.com"; } // Kendi admin mailini ekle
