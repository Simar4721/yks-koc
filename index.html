*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#090d16;--bg2:#111827;--bg3:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#f3f4f6;--text2:#9ca3af;--text3:#6b7280;
  --accent:#3b82f6;--accent2:#f97316;--glow:rgba(59,130,246,0.15);
}
body.light{
  --bg:#f8fafc;--bg2:#ffffff;--bg3:rgba(0,0,0,0.02);
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.12);
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --glow:rgba(59,130,246,0.08);
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;transition:background 0.3s,color 0.3s;
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 24px 24px;
}
#root{position:relative;z-index:1;}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cfFall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes popIn{from{transform:translateY(20px) scale(0.95);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px;}

/* Modern Motivasyon Pop-Up */
#motivationPopup {
  position: fixed; bottom: 24px; right: 24px; z-index: 900;
  max-width: 340px; width: calc(100% - 48px);
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 16px; padding: 20px;
  box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3), 0 8px 10px -6px rgba(0,0,0,0.3);
  backdrop-filter: blur(12px); animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column; gap: 10px;
}
#motivationPopup.hidden { display: none; }
.popup-header { display: flex; justify-content: space-between; align-items: center; }
.popup-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
.popup-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1.1rem; }
.popup-close:hover { color: var(--text); }
.popup-body { font-size: 0.92rem; color: var(--text); line-height: 1.5; font-weight: 500; }
</style>

// ── STATE ─────────────────────────────────────────────────────
let currentUser = null;

// ── TIMER STATE ───────────────────────────────────────────────
let timerRunning = false;
let timerStart = null;
let timerElapsed = 0;
let timerInterval = null;
const todayKey = () => new Date().toISOString().slice(0,10);

// ── HELPERS ──────────────────────────────────────────────────
function daysTo(d){ return Math.max(0, Math.ceil((d - Date.now()) / 86400000)); }
function todayStr(){ return new Date().toDateString(); }
function countStreak(streak){
  if(!streak||!streak.length) return 0;
  let c=0, d=new Date();
  while(streak.includes(d.toDateString())&&c<400){ c++; d.setDate(d.getDate()-1); }
  return c;
}
function calcStats(){
  let tD=0,tT=0,aD=0,aT=0;
  Object.entries(TOPICS).forEach(([s,topics])=>{
    const isTyt=SUBJECTS[s].type==="tyt";
    topics.forEach((_,i)=>{
      if(isTyt){tT++; if(userData.done[s+":"+i])tD++;}
      else{aT++; if(userData.done[s+":"+i])aD++;}
    });
  });
  return{tD,tT,aD,aT,total:tD+aD,all:tT+aT};
}
function getLevel(xp){
  let lvl=LEVELS[0],idx=0;
  for(let i=LEVELS.length-1;i>=0;i--){ if(xp>=LEVELS[i].min){lvl=LEVELS[i];idx=i;break;} }
  const next=LEVELS[Math.min(idx+1,LEVELS.length-1)];
  const pct=idx===LEVELS.length-1?100:Math.round((xp-lvl.min)/(next.min-lvl.min)*100);
  return{lvl,idx,next,pct};
}
function fmtTime(sec){
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function todayTotalStudy(){
  return (userData.studySeconds||{})[todayKey()] || 0;
}

// ── FIRESTORE ────────────────────────────────────────────────
async function loadUserData(uid){
  const ref = doc(db,"users",uid);
  const snap = await getDoc(ref);
  if(snap.exists()){
    userData = { done:{}, xp:0, streak:[], name:"", studySeconds:{}, exams:[], weeklyGoalHours:8, streakRecord:0, ...snap.data() };
  } else {
    userData = { done:{}, xp:0, streak:[], name: currentUser.displayName||"", studySeconds:{}, exams:[], weeklyGoalHours:8, streakRecord:0 };
  }
}

function scheduleSave(){
  if(saveTimeout) clearTimeout(saveTimeout);
  const uid = currentUser?.uid;
  const snapshot = JSON.parse(JSON.stringify(userData));
  saveTimeout = setTimeout(async ()=>{
    if(!uid || !currentUser || currentUser.uid !== uid) return;
    // merge: true ile güvenli kaydetme
    await setDoc(doc(db,"users",uid), snapshot, {merge:true});
  }, 1200);
}

// ── AUTH ──────────────────────────────────────────────────────
onAuthStateChanged(auth, async user=>{
  currentUser = user;
  if(user){
    userData = { done:{}, xp:0, streak:[], name:"", studySeconds:{}, exams:[], weeklyGoalHours:8, streakRecord:0 };
    if(timerRunning){ clearInterval(timerInterval); timerRunning=false; timerStart=null; }
    timerElapsed=0;
    showLoading("Veriler yükleniyor...");
    await loadUserData(user.uid);
    activePage="dashboard";
    initMotivation();
    render();
  } else {
    userData = { done:{}, xp:0, streak:[], name:"", studySeconds:{}, exams:[], weeklyGoalHours:8, streakRecord:0 };
    if(timerRunning){ clearInterval(timerInterval); timerRunning=false; timerStart=null; }
    timerElapsed=0;
    activePage="auth";
    authMode="login";
    render();
  }
});

// ── CONFETTI ──────────────────────────────────────────────────
function launchConfetti(){
  const colors=["#3b82f6","#f97316","#ffd60a","#10b981","#8b5cf6","#ec4899"];
  for(let i=0;i<60;i++){
    setTimeout(()=>{
      const el=document.createElement("div");
      const size=6+Math.random()*8;
      el.style.cssText=`position:fixed;width:${size}px;height:${size}px;border-radius:2px;
        left:${Math.random()*100}vw;top:-20px;z-index:9999;pointer-events:none;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        animation:cfFall ${2+Math.random()*2}s ${Math.random()*0.3}s linear forwards;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),3500);
    },i*25);
  }
}

// ── REWARD ────────────────────────────────────────────────────
function showReward(emoji,title,text,xpAmt){
  const el=document.getElementById("rewardOverlay");
  document.getElementById("rEmoji").textContent=emoji;
  document.getElementById("rTitle").textContent=title;
  document.getElementById("rText").textContent=text;
  document.getElementById("rXP").textContent=`+${xpAmt} XP kazandın! 🎯`;
  el.style.opacity="1"; el.style.pointerEvents="all";
  el.querySelector(".rbox").style.transform="scale(1)";
  launchConfetti();
}

// ── AUTH HANDLERS ─────────────────────────────────────────────
async function doRegister(){
  const nameEl=document.getElementById("authName");
  const name=nameEl?nameEl.value.trim():"";
  const email=document.getElementById("authEmail").value.trim();
  const pass=document.getElementById("authPass").value;
  const err=document.getElementById("authErr");
  if(!name||!email||!pass){ err.textContent="Tüm alanları doldur!"; return; }
  if(pass.length<6){ err.textContent="Şifre en az 6 karakter olmalı!"; return; }
  err.textContent="Kayıt yapılıyor...";
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(cred.user,{displayName:name});
    const freshData = { done:{}, xp:0, streak:[], name:name, studySeconds:{}, exams:[], weeklyGoalHours:8, streakRecord:0 };
    await setDoc(doc(db,"users",cred.user.uid), freshData);
  } catch(e){
    if(e.code==="auth/email-already-in-use") err.textContent="Bu e-posta zaten kayıtlı!";
    else if(e.code==="auth/invalid-email") err.textContent="Geçersiz e-posta adresi!";
    else err.textContent="Hata: "+e.message;
  }
}

async function doLogin(){
  const email=document.getElementById("authEmail").value.trim();
  const pass=document.getElementById("authPass").value;
  const err=document.getElementById("authErr");
  err.textContent="Giriş yapılıyor...";
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  } catch(e){
    if(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password") err.textContent="E-posta veya şifre hatalı!";
    else if(e.code==="auth/user-not-found") err.textContent="Bu e-posta ile kayıtlı kullanıcı yok!";
    else if(e.code==="auth/invalid-email") err.textContent="Geçersiz e-posta adresi!";
    else err.textContent="Hata: "+e.message;
  }
}

async function doForgotPassword(){
  const email=document.getElementById("authEmail").value.trim();
  const err=document.getElementById("authErr");
  if(!email){ err.style.color="#ffd60a"; err.textContent="E-posta adresini gir, sıfırlama maili gönderelim."; return; }
  try{
    await sendPasswordResetEmail(auth, email);
    err.style.color="#2ed573";
    err.textContent="Şifre sıfırlama bağlantısı e-posta adresinize gönderildi.";
  } catch(e){
    err.style.color="#ff4757";
    err.textContent="Hata: " + e.message;
  }
}
