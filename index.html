// ── HELPERS ──────────────────────────────────────────────────
function daysTo(d){ return Math.max(0, Math.ceil((d - Date.now()) / 86400000)); }
function todayStr(){ return new Date().toDateString(); }
function countStreak(streak){
  if(!streak||!streak.length) return 0;
  let c=0, d=new Date();
  while(streak.includes(d.toDateString())&&c<400){ c++; d.setDate(d.getDate()-1); }
  return c;
}
function calcStats(){
  let tD=0,tT=0,aD=0,aT=0;
  Object.entries(TOPICS).forEach(([s,topics])=>{
    const isTyt=SUBJECTS[s].type==="tyt";
    topics.forEach((_,i)=>{
      if(isTyt){tT++; if(userData.done[s+":"+i])tD++;}
      else{aT++; if(userData.done[s+":"+i])aD++;}
    });
  });
  return{tD,tT,aD,aT,total:tD+aD,all:tT+aT};
}
function getLevel(xp){
  let lvl=LEVELS[0],idx=0;
  for(let i=LEVELS.length-1;i>=0;i--){ if(xp>=LEVELS[i].min){lvl=LEVELS[i];idx=i;break;} }
  const next=LEVELS[Math.min(idx+1,LEVELS.length-1)];
  const pct=idx===LEVELS.length-1?100:Math.round((xp-lvl.min)/(next.min-lvl.min)*100);
  return{lvl,idx,next,pct};
}
function fmtTime(sec){
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function todayTotalStudy(){
  return (userData.studySeconds||{})[todayKey()] || 0;
}

// ── TIMER LOGIC ───────────────────────────────────────────────
function timerCurrentSec(){
  if(timerRunning && timerStart) return timerElapsed + Math.floor((Date.now()-timerStart)/1000);
  return timerElapsed;
}
function timerTick(){
  const sec = timerCurrentSec();
  const el = document.getElementById("timerDisplay");
  if(el) el.textContent = fmtTime(sec);
  // also update today total
  const tot = document.getElementById("timerTodayTotal");
  if(tot) tot.textContent = fmtTime(todayTotalStudy() + (timerRunning ? Math.floor((Date.now()-timerStart)/1000) : 0));
}
function timerStartStop(){
  if(!timerRunning){
    timerStart = Date.now();
    timerRunning = true;
    timerInterval = setInterval(timerTick, 1000);
    // Bugünü streak'e ekle
    const t=todayStr();
    if(!userData.streak) userData.streak=[];
    if(!userData.streak.includes(t)){
      userData.streak.push(t);
      updateStreakRecord();
      scheduleSave();
      // Uyarı banner'ını kaldır
      const banner=document.getElementById("noChallengeWarning");
      if(banner) banner.remove();
    }
    const btn = document.getElementById("timerBtn");
    if(btn){ btn.textContent="⏸ Durdur"; btn.style.background="#ff4757"; }
    const dot = document.getElementById("timerDot");
    if(dot) dot.style.animation="pulse 1s infinite";
  } else {
    const elapsed = Math.floor((Date.now()-timerStart)/1000);
    timerElapsed += elapsed;
    // save to userData
    if(!userData.studySeconds) userData.studySeconds={};
    userData.studySeconds[todayKey()] = (userData.studySeconds[todayKey()]||0) + elapsed;
    timerStart = null;
    timerRunning = false;
    clearInterval(timerInterval);
    scheduleSave();
    const btn = document.getElementById("timerBtn");
    if(btn){ btn.textContent="▶ Başlat"; btn.style.background="#2ed573"; }
    const dot = document.getElementById("timerDot");
    if(dot) dot.style.animation="none";
    timerTick();
  }
}
function timerReset(){
  if(timerRunning) timerStartStop(); // stop first
  timerElapsed = 0;
  timerStart = null;
  timerTick();
}

    const d=new Date(); d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    total+=(ss[k]||0);
  }
  return total;
}
function updateStreakRecord(){
  const cur=countStreak(userData.streak||[]);
  if(cur>(userData.streakRecord||0)){
    userData.streakRecord=cur;
  }
}


// ── TOGGLE TOPIC ─────────────────────────────────────────────
function toggleTopic(subj,i){
  const key=subj+":"+i;
  const wasDone=!!userData.done[key];
  const xpAmt=SUBJECTS[subj].xp;
  userData.done[key]=!wasDone;
  const t=todayStr();
  if(!userData.streak) userData.streak=[];
  if(!userData.streak.includes(t)) userData.streak.push(t);
  updateStreakRecord();
  if(!wasDone){
    userData.xp+=xpAmt;
    const s=calcStats();
    const p=s.total/s.all;
    let em="✅",ti="KONU TAMAM!",tx="Harika! Bir adım daha attın. Devam et!";
    if(s.total===1){em="⭐";ti="İLK ADIM!";tx="İlk konunu tamamladın. Her büyük yolculuk bir adımla başlar.";}
    else if(s.total===5){em="🔥";ti="MOMENTUM!";tx="5 konu bitti! Ateş yanıyor, durma.";}
    else if(s.total===10){em="💪";ti="ÇALIŞIYOR!";tx="10 konu tamam. Ritim tutturuldu.";}
    else if(p>=0.25&&p<0.27){em="💎";ti="ÇEYREĞİ GEÇTİN!";tx="Konuların %25'ini tamamladın. İnanılmaz!";}
    else if(p>=0.50&&p<0.52){em="🚀";ti="YARIYA GELDİN!";tx="%50 tamamlandı. Çoğu insan bu noktaya gelemez.";}
    else if(p>=0.75&&p<0.77){em="👑";ti="NEREDEYSE BİTTİ!";tx="%75 tamamlandı. Zirve görünüyor!";}
    else if(p>=1){em="🏆";ti="EFSANE!";tx="Tüm konuları tamamladın. Sen artık başka birisin.";}
    showReward(em,ti,tx,xpAmt);
  } else {
    userData.xp=Math.max(0,userData.xp-xpAmt);
  }
  scheduleSave();
  renderTopics();
  renderStats();
}

// ── COACH LOGIC ───────────────────────────────────────────────
function getCoachRecommendations() {
  const stats = calcStats();
  const overallPercent = Math.round((stats.total / stats.all) * 100) || 0;
  const streak = countStreak(userData.streak || []);
  const recommendations = [];

  if (streak === 0) {
    recommendations.push("Bugün henüz çalışma kaydedilmedi. Serini bozmamak için kronometreyi başlat veya en az bir konu tamamla!");
  } else {
    recommendations.push(`Harika gidiyorsun! ${streak} günlük bir çalışma serin var, bunu korumaya devam et.`);
  }

  if (overallPercent < 20) {
    recommendations.push("Henüz yolun başındasın. Önceliğini temel TYT konularına (Matematik ve Türkçe) vererek ivme kazanabilirsin.");
  } else if (overallPercent < 50) {
    recommendations.push("Temel gayet iyi oturuyor. Artık YKS netlerini yükseltmek için AYT konularına ağırlık vermenin zamanı geldi.");
  } else {
    recommendations.push("Konuların büyük kısmını halletmişsin! Eksik kalan alanları tarayıp branş denemelerine odaklanabilirsin.");
  }

  return recommendations;
}

        <div style="display:flex;gap:12px;align-items:center;">
          <button onclick="window.toggleTheme()" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;cursor:pointer;">🌓</button>
          <button onclick="window.doLogout()" style="background:#ff4757;border:none;color:#fff;padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer;">Çıkış</button>
        </div>
      </header>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px;">
        <div style="background:var(--bg2);border:1px solid var(--border);padding:16px;border-radius:12px;">
          <div style="font-size:0.8rem;color:var(--text2);">TYT KALAN ZAMAN</div>
          <div style="font-size:1.4rem;font-weight:700;color:var(--accent);">${daysTo(TYT_DATE)} Gün</div>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--border);padding:16px;border-radius:12px;">
          <div style="font-size:0.8rem;color:var(--text2);">AYT KALAN ZAMAN</div>
          <div style="font-size:1.4rem;font-weight:700;color:var(--accent2);">${daysTo(AYT_DATE)} Gün</div>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--border);padding:16px;border-radius:12px;">
          <div style="font-size:0.8rem;color:var(--text2);">MEVCUT SERİ</div>
          <div style="font-size:1.4rem;font-weight:700;color:#ffd60a;">🔥 ${streak} Gün</div>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--border);padding:16px;border-radius:12px;">
          <div style="font-size:0.8rem;color:var(--text2);">SEVİYE / XP</div>
          <div style="font-size:1.1rem;font-weight:700;color:#2ed573;">${lvl.lvl.name} (${userData.xp} XP)</div>
        </div>
      </div>

      <div style="background:var(--bg2);border:1px solid var(--border);padding:20px;border-radius:12px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span id="timerDot" style="width:10px;height:10px;border-radius:50%;background:#2ed573;display:inline-block;"></span>
            <span style="font-weight:700;font-size:0.9rem;">Çalışma Zamanlayıcısı</span>
          </div>
          <div id="timerDisplay" style="font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:600;margin-top:4px;">${fmtTime(timerCurrentSec())}</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button id="timerBtn" onclick="window.timerStartStop()" style="background:${timerRunning ? '#ff4757' : '#2ed573'};border:none;color:#000;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;">
            ${timerRunning ? '⏸ Durdur' : '▶ Başlat'}
          </button>
          <button onclick="window.timerReset()" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;cursor:pointer;">Sıfırla</button>
        </div>
      </div>

      <div style="background:var(--bg2);border:1px solid var(--border);padding:20px;border-radius:12px;margin-bottom:24px;">
        <h3 style="font-size:1rem;margin-bottom:12px;color:var(--accent);">🤖 Koç Tavsiyesi</h3>
        <ul style="padding-left:20px;font-size:0.9rem;color:var(--text3);line-height:1.6;">
          ${recommendations.map(rec => `<li style="margin-bottom:6px;">${rec}</li>`).join('')}
        </ul>
      </div>

      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;">
        ${Object.keys(SUBJECTS).map(s => `
          <button class="subTab" data-s="${s}" onclick="window.setSubject('${s}')" style="
            padding:8px 16px;
            border-radius:8px;
            border:1px solid ${s === activeSub ? SUBJECTS[s].color : 'var(--border)'};
            background:${s === activeSub ? SUBJECTS[s].color : 'transparent'};
            color:${s === activeSub ? '#000' : 'var(--text2)'};
            font-weight:${s === activeSub ? '700' : '400'};
            white-space:nowrap;
            cursor:pointer;
          ">
            ${SUBJECTS[s].label}
          </button>
        `).join('')}
      </div>

      <div id="topicsContainer"></div>
    </div>
  `;

  renderTopics();
}

function render() {
  if (activePage === "auth") {
    renderAuth();
  } else {
    renderDashboard();
  }
}

// Global Tanımlamalar
window.doRegister = doRegister;
window.doLogin = doLogin;
window.doForgotPassword = doForgotPassword;
window.doLogout = doLogout;
window.toggleTopic = toggleTopic;
window.setSubject = setSubject;
window.timerStartStop = timerStartStop;
window.timerReset = timerReset;
window.toggleAuthMode = () => { authMode = authMode === "register" ? "login" : "register"; renderAuth(); };
window.toggleTheme = () => {
  isDark = !isDark;
  document.body.classList.toggle("light", !isDark);
  localStorage.setItem("theme", isDark ? "dark" : "light");
};

document.getElementById("rewardBtn")?.addEventListener("click", closeReward);
</script>
</body>
</html>
