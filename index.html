


<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YKS — Takip Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0a12;--bg2:#14141f;--bg3:rgba(255,255,255,0.035);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#eef0f7;--text2:#5a6a7e;--text3:#b0bec5;
  --accent:#6366f1;--accent2:#14b8a6;
  --shadow:0 8px 28px rgba(0,0,0,0.28);
}
body.light{
  --bg:#f5f6fb;--bg2:#ffffff;--bg3:rgba(15,15,35,0.025);
  --border:rgba(15,15,35,0.08);--border2:rgba(15,15,35,0.13);
  --text:#171726;--text2:#64748b;--text3:#475569;
  --shadow:0 8px 28px rgba(20,20,40,0.08);
}
body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;min-height:100vh;transition:background 0.3s,color 0.3s;letter-spacing:-0.01em;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(99,102,241,0.07) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 90%,rgba(20,184,166,0.06) 0%,transparent 60%);}
body.light::before{
  background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(99,102,241,0.07) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 90%,rgba(20,184,166,0.07) 0%,transparent 60%);}
#root{position:relative;z-index:1;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cfFall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:10px;}
body.light ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);}
button{font-family:inherit;}
input{font-family:inherit;}

/* ─────────────── YKS MODERN UI LAYER ─────────────── */
:root{
  --bg:#080b14;
  --bg2:#111827;
  --bg3:rgba(255,255,255,.045);
  --border:rgba(255,255,255,.09);
  --border2:rgba(255,255,255,.15);
  --text:#f8fafc;
  --text2:#94a3b8;
  --text3:#cbd5e1;
  --accent:#7c83ff;
  --accent2:#2dd4bf;
  --shadow:0 18px 50px rgba(0,0,0,.28);
}
body{
  background:
    radial-gradient(900px 500px at -5% -10%,rgba(124,131,255,.14),transparent 60%),
    radial-gradient(800px 500px at 105% 110%,rgba(45,212,191,.10),transparent 60%),
    var(--bg);
  color:var(--text);
}
body.light{
  --bg:#f4f7fb;
  --bg2:#ffffff;
  --bg3:rgba(15,23,42,.035);
  --border:rgba(15,23,42,.09);
  --border2:rgba(15,23,42,.15);
  --text:#0f172a;
  --text2:#64748b;
  --text3:#475569;
  --shadow:0 18px 50px rgba(15,23,42,.10);
  background:
    radial-gradient(900px 500px at -5% -10%,rgba(99,102,241,.10),transparent 60%),
    radial-gradient(800px 500px at 105% 110%,rgba(20,184,166,.08),transparent 60%),
    var(--bg);
}
#root{min-height:100vh}
#root > div{animation:pageIn .28s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.brandArea,.authBrand{display:flex;align-items:center}
.brandLockup{display:inline-flex;align-items:center;gap:10px}
.brandMark{width:38px;height:38px;display:inline-flex;filter:drop-shadow(0 8px 18px rgba(99,102,241,.22))}
.brandMark svg{width:100%;height:100%;display:block}
.brandText{font-size:1.25rem;font-weight:850;letter-spacing:-.04em;color:var(--text)}
.authBrand{justify-content:center;margin-bottom:8px}
.authBrand .brandMark{width:52px;height:52px}
.authBrand .brandText{font-size:1.8rem}
button,input{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0) scale(.98)}
input:focus{
  border-color:rgba(124,131,255,.65)!important;
  box-shadow:0 0 0 4px rgba(124,131,255,.12);
}
#root [style*="background:#14141f"]{
  background:linear-gradient(145deg,var(--bg2),color-mix(in srgb,var(--bg2) 90%,#7c83ff 10%))!important;
  box-shadow:var(--shadow);
}
#root [style*="border:1px solid rgba(255,255,255,0.07)"]{
  border-color:var(--border)!important;
}
#root [style*="border:1px solid rgba(255,255,255,0.1)"]{
  border-color:var(--border2)!important;
}
#root [style*="border-radius:12px"],
#root [style*="border-radius:16px"]{border-radius:18px!important}
#root [style*="border-radius:8px"]{border-radius:11px!important}
#root [style*="font-family:monospace"]{letter-spacing:.02em}
#mainNav{align-items:center}
#mainNav button{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.subTab{box-shadow:0 4px 18px rgba(0,0,0,.08)}
#topicList > div,#examList > div{box-shadow:0 8px 28px rgba(0,0,0,.10)}
#topicList > div:hover{transform:translateY(-2px);border-color:rgba(124,131,255,.42)!important}
table tr{transition:background .16s ease}
@media (max-width:720px){
  #root > div{padding-left:14px!important;padding-right:14px!important}
  header{padding-bottom:16px!important;margin-bottom:18px!important}
  #mainNav{width:100%;overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap!important}
  #mainNav button{flex:0 0 auto}
  .brandMark{width:34px;height:34px}
  .brandText{font-size:1.1rem}
  #topicSearch{width:100%!important}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>

<style id="yks-pro-enhancements">
#yksProFeatures{margin:24px 0 40px;font-family:inherit}
#yksProFeatures *{box-sizing:border-box}
.yks-pro-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.yks-card{grid-column:span 4;background:var(--card-bg,#fff);border:1px solid rgba(100,116,139,.16);border-radius:20px;padding:20px;box-shadow:0 12px 35px rgba(15,23,42,.07)}
.yks-card.wide{grid-column:span 8}.yks-card.full{grid-column:1/-1}
.yks-card h3{margin:0 0 6px;font-size:18px}.yks-muted{color:#64748b;font-size:13px}
.yks-stat{font-size:28px;font-weight:800;margin:8px 0}
.yks-progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:12px 0}
.yks-progress>span{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#6366f1,#06b6d4)}
.yks-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.yks-btn{border:0;border-radius:12px;padding:10px 13px;cursor:pointer;font-weight:700;background:#eef2ff;color:#3730a3}
.yks-btn.primary{background:linear-gradient(135deg,#4f46e5,#0891b2);color:#fff}
.yks-btn.danger{background:#fee2e2;color:#991b1b}
.yks-input,.yks-select,.yks-textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;background:transparent;color:inherit;outline:none}
.yks-input:focus,.yks-select:focus,.yks-textarea:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.13)}
.yks-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.yks-form .fullrow{grid-column:1/-1}
.yks-list{display:grid;gap:9px;margin-top:12px;max-height:280px;overflow:auto}
.yks-item{padding:11px 12px;border-radius:13px;background:rgba(148,163,184,.09);display:flex;align-items:center;gap:10px}
.yks-item .grow{flex:1;min-width:0}.yks-item small{color:#64748b}
.yks-check{width:20px;height:20px;accent-color:#4f46e5}
.yks-tag{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#eef2ff;color:#4338ca}
.yks-tag.red{background:#fee2e2;color:#b91c1c}.yks-tag.yellow{background:#fef3c7;color:#92400e}.yks-tag.green{background:#dcfce7;color:#166534}
.yks-heatmap{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:14px}
.yks-day{aspect-ratio:1;border-radius:4px;background:#e2e8f0;cursor:pointer}.yks-day[data-level="1"]{background:#c7d2fe}.yks-day[data-level="2"]{background:#818cf8}.yks-day[data-level="3"]{background:#4f46e5}.yks-day[data-level="4"]{background:#312e81}
.yks-chart{height:180px;display:flex;align-items:end;gap:7px;margin-top:16px;padding:10px 0}
.yks-bar{flex:1;min-width:4px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#06b6d4,#6366f1);height:4%;transition:.3s}
.yks-bar span{display:block;text-align:center;font-size:10px;margin-top:-18px;color:#64748b}
.yks-empty{padding:20px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:14px}
.yks-ai{background:linear-gradient(135deg,rgba(79,70,229,.10),rgba(8,145,178,.10))}
.yks-section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
@media(max-width:900px){.yks-card,.yks-card.wide{grid-column:1/-1}.yks-form{grid-template-columns:1fr}.yks-form .fullrow{grid-column:auto}}
@media(prefers-color-scheme:dark){
 .yks-card{background:rgba(15,23,42,.72);border-color:rgba(148,163,184,.18)}
 .yks-input,.yks-select,.yks-textarea{border-color:#475569}
 .yks-progress,.yks-day{background:#334155}.yks-item{background:rgba(51,65,85,.35)}
}
</style>



<style id="yks-modern-theme-v3">
:root{
  --yks-bg:#070b12;
  --yks-surface:#0d1420;
  --yks-surface-2:#111b29;
  --yks-border:rgba(148,163,184,.15);
  --yks-text:#f8fafc;
  --yks-muted:#94a3b8;
  --yks-orange:#ff8a24;
  --yks-orange-2:#ffb347;
  --yks-green:#22c55e;
  --yks-blue:#38bdf8;
  --yks-shadow:0 18px 55px rgba(0,0,0,.28);
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 12% 0%,rgba(255,138,36,.08),transparent 30%),
    radial-gradient(circle at 88% 10%,rgba(56,189,248,.06),transparent 28%),
    var(--yks-bg)!important;
  color:var(--yks-text);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:linear-gradient(135deg,rgba(255,255,255,.012),transparent 45%,rgba(255,138,36,.018));
}
button,input,select,textarea{font:inherit}
button{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(1px)}
#root>div{min-height:100vh}
#mainNav{
  background:linear-gradient(180deg,rgba(13,20,32,.96),rgba(7,11,18,.92))!important;
  border:1px solid var(--yks-border)!important;
  box-shadow:var(--yks-shadow)!important;
  backdrop-filter:blur(18px);
}
#mainNav button{
  border-radius:13px!important;
  color:#cbd5e1!important;
}
#mainNav button:hover{background:rgba(255,138,36,.09)!important;color:#fff!important}
#mainNav button.active{
  background:linear-gradient(135deg,#ff7a18,#f97316)!important;
  color:#fff!important;
  box-shadow:0 10px 25px rgba(249,115,22,.24)!important;
}
.yks-tiger-logo{
  width:52px;height:52px;display:inline-block;vertical-align:middle;
  filter:drop-shadow(0 8px 18px rgba(249,115,22,.25));
}
.yks-logo-text{font-weight:900;font-size:20px;margin-left:8px;letter-spacing:.06em}
.yks-pro-grid{gap:18px!important}
.yks-card{
  background:linear-gradient(145deg,rgba(17,27,41,.94),rgba(10,16,26,.94))!important;
  border:1px solid rgba(148,163,184,.14)!important;
  box-shadow:0 16px 45px rgba(0,0,0,.22)!important;
}
.yks-card:hover{border-color:rgba(255,138,36,.28)!important}
.yks-btn.primary{
  background:linear-gradient(135deg,#ff8a24,#f97316)!important;
  box-shadow:0 9px 22px rgba(249,115,22,.2);
}
.yks-btn{background:#172235!important;color:#e2e8f0!important}
.yks-input,.yks-select,.yks-textarea{
  background:#0a111c!important;color:#f8fafc!important;border-color:#263449!important;
}
.yks-item{background:rgba(30,41,59,.38)!important}
.yks-progress{background:#1e293b!important}
.yks-progress>span{background:linear-gradient(90deg,#ff8a24,#22c55e)!important}
.yks-bar{background:linear-gradient(180deg,#38bdf8,#6366f1)!important}
.yks-ai{background:linear-gradient(135deg,rgba(249,115,22,.09),rgba(56,189,248,.07))!important}
@media(max-width:760px){
  #mainNav{overflow-x:auto}
  .yks-pro-grid{grid-template-columns:1fr!important}
  .yks-card,.yks-card.wide,.yks-card.full{grid-column:1/-1!important}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

.dashboard-main {
  margin-left:224px; width:calc(100% - 224px); padding:24px 24px 28px;
}
.dash-container { width:min(1140px,100%); margin:0 auto; }
.dash-brand { position:relative; text-align:center; padding:3px 0 18px; z-index:2; }
.dash-brand .dash-tiger {
  width:128px; height:108px; display:block; object-fit:cover; object-position:center;
  margin:0 auto 4px; mix-blend-mode:screen; filter:drop-shadow(0 8px 18px rgba(255,118,20,.16));
}
.dash-brand .dash-yks {
  font-size:28px; font-weight:900; letter-spacing:.02em; color:#f7f7f7; line-height:1;
}
.dash-brand .dash-tag {
  margin-top:7px; font-size:9px; letter-spacing:2.1px; color:#9aabb9; font-weight:700;
}
.sidebar-collapse { position:absolute; right:13px; top:12px; color:var(--shot-orange); font-size:18px; }
.sidebar-nav { position:relative; z-index:3; display:grid; gap:4px; margin-top:4px; }
.sidebar-item {
  display:flex; align-items:center; gap:14px; width:100%; padding:12px 14px;
  border:0; border-radius:9px; background:transparent; color:#c2d0dc;
  font-size:15px; text-align:left; cursor:pointer;
}
.sidebar-item:hover { background:rgba(255,118,20,.08); color:#fff; }
.sidebar-item.active {
  background:linear-gradient(90deg,#f87614,#ff7f12); color:#fff; box-shadow:0 10px 24px rgba(255,118,20,.18);
}
.sidebar-icon { width:23px; text-align:center; color:var(--shot-orange); font-size:20px; flex:none; }
.sidebar-item.active .sidebar-icon { color:#fff; }
.sidebar-quote {
  position:absolute; left:18px; right:18px; bottom:276px; z-index:3;
  color:#e7eef3; font-size:13px; line-height:1.55; font-style:italic;
}
.sidebar-theme {
  position:absolute; left:12px; right:12px; bottom:57px; z-index:4;
  background:rgba(13,18,23,.97); border:1px solid #27303a; border-radius:10px;
  padding:13px 12px; box-shadow:0 20px 44px rgba(0,0,0,.34);
}
.sidebar-theme h4 { font-size:14px; margin:0 0 4px; }
.sidebar-theme p { font-size:10px; color:#8ea0b2; margin:0 0 10px; }
.theme-swatches { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.theme-swatch {
  width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.12);
  cursor:pointer; padding:0;
}
.theme-custom { display:flex; gap:7px; align-items:center; }
.theme-custom input[type="color"] { width:32px; height:28px; padding:0; border:1px solid #33414d; border-radius:7px; background:#10151a; }
.theme-save {
  flex:1; border:0; border-radius:7px; padding:8px 9px; cursor:pointer;
  background:linear-gradient(90deg,#f87210,#ff8c22); color:#fff; font-size:11px; font-weight:800;
}
.sidebar-footer { position:absolute; bottom:10px; left:24px; right:24px; font-size:9px; line-height:1.5; color:#8897a4; z-index:3; }

.dash-top {
  display:grid; grid-template-columns:1fr auto; align-items:start; gap:24px; margin-bottom:18px;
}
.dash-title h1 { margin:0; font-size:27px; font-weight:850; letter-spacing:-.03em; }
.dash-title p { margin:5px 0 0; font-size:15px; color:#9fb0bf; }
.dash-title p b { color:#ecf2f6; }
.dash-actions { display:flex; align-items:center; gap:12px; }
.dash-quote { align-self:center; color:#6d7a88; font-size:12px; font-style:italic; text-align:center; max-width:250px; }
.dash-date, .dash-icon-btn, .dash-avatar {
  border:1px solid #27313b; background:#0f151b; color:#eaf0f4; border-radius:8px;
}
.dash-date { padding:10px 15px; min-width:124px; font-size:12px; line-height:1.2; }
.dash-date strong { display:block; color:#fff; }
.dash-icon-btn { width:46px; height:42px; position:relative; cursor:pointer; font-size:18px; }
.dash-icon-btn .dot { position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background:#ff8d28; }
.dash-avatar { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; background:#4b1d1d; border-color:#6b3030; }

.dash-count-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:14px; }
.count-card {
  min-height:132px; border-radius:9px; border:1px solid #27313a; background:#10161c;
  position:relative; overflow:hidden; padding:18px 20px;
}
.count-card::after {
  content:""; position:absolute; inset:0; opacity:.5; background:
    radial-gradient(80% 120% at 96% 80%, rgba(255,112,21,.22), transparent 58%),
    linear-gradient(145deg,transparent 62%,rgba(255,255,255,.02));
}
.count-card.ayt::after {
  background:
    radial-gradient(80% 120% at 96% 80%, rgba(70,142,233,.18), transparent 58%),
    linear-gradient(145deg,transparent 62%,rgba(255,255,255,.02));
}
.count-card.quote-card::after { background-image:linear-gradient(90deg,rgba(120,70,45,.20),rgba(255,118,20,.12)); }
.count-inner { position:relative; z-index:2; }
.count-label { color:#9fb0bf; font-size:14px; }
.count-label .ico { color:var(--shot-orange); font-size:20px; margin-right:10px; }
.count-number { font-size:25px; font-weight:850; margin-top:12px; }
.count-date { color:#a4b3c0; font-size:12px; margin-top:3px; }
.quote-card .quote-text { font-style:italic; font-size:14px; line-height:1.45; max-width:250px; }
.quote-card .quote-author { margin-top:10px; font-size:12px; color:#a5b3be; }

.stat-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
.stat-card {
  min-height:109px; border:1px solid #202a34; background:#0e1419; border-radius:9px;
  padding:17px 14px; text-align:center;
}
.stat-card .stat-ico { color:var(--shot-orange); font-size:22px; }
.stat-card .stat-label { color:#9baab8; font-size:12px; margin-top:6px; }
.stat-card .stat-value { font-size:21px; font-weight:850; margin-top:7px; }
.stat-card .stat-sub { color:#a0adba; font-size:11px; margin-top:4px; }
.stat-card .up { color:#2ed573; font-weight:800; }
.stat-card .levelbar { height:8px; border-radius:999px; background:#1d2730; overflow:hidden; margin-top:10px; }
.stat-card .levelbar span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#ff7614,#ff9a35); }

.pro-row { display:grid; grid-template-columns:1.08fr .92fr; gap:14px; margin-bottom:14px; }
.dash-card {
  border:1px solid #202b34; background:linear-gradient(145deg,#10161c,#0b1015);
  border-radius:10px; padding:15px; box-shadow:0 14px 36px rgba(0,0,0,.15);
}
.dash-card-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
.dash-card-title h3 { margin:0; font-size:15px; font-weight:800; }
.dash-card-title p { margin:4px 0 0; color:#91a0af; font-size:11px; }
.pro-heading { display:flex; gap:12px; align-items:center; }
.pro-bolt { color:#ff8d1f; font-size:29px; }
.pro-pill {
  margin-left:5px; padding:3px 7px; border:1px solid #ff7414; border-radius:5px;
  color:#ff8b25; font-size:9px; font-weight:900; letter-spacing:.8px;
}
.pro-edit {
  border:0; border-radius:8px; padding:10px 13px; cursor:pointer;
  background:linear-gradient(90deg,#ff7613,#ff8725); color:#fff; font-weight:800; font-size:11px;
}
.plan-list { border:1px solid #26313a; background:#0d1318; border-radius:9px; padding:9px 10px; }
.plan-head, .plan-row { display:grid; grid-template-columns:28px 1fr 65px; align-items:center; gap:8px; }
.plan-head { padding:3px 8px 10px; color:#eef2f5; font-size:12px; font-weight:800; }
.plan-row { padding:10px 8px; border-top:1px solid #19222a; font-size:11px; color:#e4ebef; }
.plan-row .ok {
  width:20px; height:20px; border-radius:5px; border:2px solid #31404b; display:flex; align-items:center; justify-content:center; color:#000;
  cursor:pointer; background:transparent;
}
.plan-row .ok.checked { background:#2ed573; border-color:#2ed573; }
.plan-row .time { text-align:right; color:#bcc8d2; font-size:11px; }
.plan-more { color:#9aa9b7; font-size:10px; text-align:right; padding:7px 8px 2px; }

.heat-wrap { min-height:100%; }
.heat-status { color:#42e083; font-size:11px; margin:0 0 9px; }
.heat-months { display:grid; grid-template-columns:repeat(14,1fr); color:#8797a5; font-size:10px; gap:4px; margin-bottom:5px; }
.heatmap-shot { display:grid; grid-template-columns:repeat(14,1fr); gap:4px; }
.heat-cell {
  height:13px; border-radius:3px; background:#1b3432; border:1px solid rgba(255,255,255,.03);
}
.heat-cell.l1 { background:#195446; } .heat-cell.l2 { background:#24765d; } .heat-cell.l3 { background:#33ab73; }
.heat-cell.l4 { background:#41d58e; } .heat-cell.l5 { background:#6ae6a8; }
.heat-legend { display:flex; justify-content:flex-end; gap:10px; color:#82929e; font-size:9px; margin-top:9px; }
.goal-mini { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:11px; }
.goal-box { border:1px solid #26323b; border-radius:9px; padding:12px; background:#0d141a; }
.goal-box .goal-ico { color:#ff5e63; font-size:24px; }
.goal-box h4 { margin:4px 0 0; font-size:13px; } .goal-box .big { font-size:20px; font-weight:850; margin-top:2px; }
.goal-box .small { color:#94a2af; font-size:10px; margin-top:4px; }

.chart-row { display:grid; grid-template-columns:1.08fr .92fr .92fr; gap:14px; margin-bottom:14px; }
.chart-shell { height:181px; position:relative; }
.line-svg { width:100%; height:100%; display:block; }
.donut-wrap { display:flex; align-items:center; justify-content:center; height:181px; gap:15px; }
.donut {
  width:118px; height:118px; border-radius:50%;
  background:conic-gradient(#37d177 0 30%,#419fe9 30% 63%,#ffbf2d 63% 83%,#ff5961 83% 100%);
  position:relative;
}
.donut::after {
  content:""; position:absolute; inset:23px; background:#10161c; border-radius:50%;
}
.donut-center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:2; font-size:11px; color:#d8e0e5; }
.donut-center b { font-size:21px; color:#fff; }
.legend-list { display:grid; gap:9px; font-size:10px; color:#9eabb7; }
.legend-line { display:flex; align-items:center; gap:6px; } .legend-dot { width:10px; height:10px; border-radius:50%; flex:none; }
.mistakes { display:grid; gap:7px; }
.mistake {
  border:1px solid #232d36; background:#0d1419; border-radius:8px; padding:9px 10px;
  display:grid; grid-template-columns:20px 1fr 18px; align-items:center; gap:7px;
}
.mistake .micon { color:#ff5961; font-size:15px; } .mistake:nth-child(2) .micon { color:#f5c33a; }
.mistake .mtext { font-size:10px; line-height:1.35; } .mistake .mtext small { color:#8d9aa7; display:block; }
.mistake .redo { color:#ff7620; font-size:15px; }

.assist-row { display:grid; grid-template-columns:1fr .44fr; gap:14px; }
.assistant-box { min-height:158px; }
.assistant-head { display:flex; align-items:center; gap:11px; }
.bot {
  width:40px; height:40px; border-radius:10px; border:1px solid #433b5e;
  display:flex; align-items:center; justify-content:center; font-size:23px;
  background:linear-gradient(135deg,#33215c,#1f4768);
}
.ai-title { font-size:15px; font-weight:850; } .ai-sub { color:#8f9dab; font-size:11px; margin-top:2px; }
.askbar { display:grid; grid-template-columns:1fr 44px; gap:7px; margin-top:12px; }
.askbar input {
  width:100%; background:#121a21; border:1px solid #2b3741; color:#eaf0f4; border-radius:8px; padding:11px 13px;
  outline:none; font-size:11px;
}
.askbar button { border:0; border-radius:8px; cursor:pointer; background:#ff7614; color:#fff; font-size:17px; }
.quick-btns { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
.quick-btns button {
  border:1px solid #2a3540; background:#0f161d; color:#b4c0ca; padding:8px 10px; border-radius:18px; font-size:9px; cursor:pointer;
}
.quote-panel { min-height:158px; position:relative; overflow:hidden; }

// ── HELPERS ──────────────────────────────────────────────────
function daysTo(d){ return Math.max(0, Math.ceil((d - Date.now()) / 86400000)); }
function todayStr(){ return new Date().toDateString(); }
function todayKeyForDate(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
function countStreak(streak){
  if(!streak||!streak.length) return 0;
  let c=0, d=new Date();
  while(streak.includes(d.toDateString())&&c<400){ c++; d.setDate(d.getDate()-1); }
  return c;
}
function calcStats(){
  let tD=0,tT=0,aD=0,aT=0;
  Object.entries(TOPICS).forEach(([s,topics])=>{
    const isTyt=SUBJECTS[s].type==="tyt";
    topics.forEach((_,i)=>{
      if(isTyt){tT++; if(userData.done[s+":"+i])tD++;}
      else{aT++; if(userData.done[s+":"+i])aD++;}
    });
  });
  return{tD,tT,aD,aT,total:tD+aD,all:tT+aT};
}
function getLevel(xp){
  let lvl=LEVELS[0],idx=0;
  for(let i=LEVELS.length-1;i>=0;i--){ if(xp>=LEVELS[i].min){lvl=LEVELS[i];idx=i;break;} }
  const next=LEVELS[Math.min(idx+1,LEVELS.length-1)];
  const pct=idx===LEVELS.length-1?100:Math.round((xp-lvl.min)/(next.min-lvl.min)*100);
  return{lvl,idx,next,pct};
}
function fmtTime(sec){
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function todayTotalStudy(){
  return (userData.studySeconds||{})[todayKey()] || 0;
}

// ── TIMER LOGIC ───────────────────────────────────────────────
function timerCurrentSec(){
  if(timerRunning && timerStart) return timerElapsed + Math.floor((Date.now()-timerStart)/1000);
  return timerElapsed;
}
function timerTick(){
  const sec = timerCurrentSec();
  const el = document.getElementById("timerDisplay");
  if(el) el.textContent = fmtTime(sec);
  // also update today total
  const tot = document.getElementById("timerTodayTotal");
  if(tot) tot.textContent = fmtTime(todayTotalStudy() + (timerRunning ? Math.floor((Date.now()-timerStart)/1000) : 0));
}
function timerStartStop(){
  if(!timerRunning){
    timerStart = Date.now();
    timerRunning = true;
    timerInterval = setInterval(timerTick, 1000);
    // Bugünü streak'e ekle
    const t=todayStr();
    if(!userData.streak) userData.streak=[];
    if(!userData.streak.includes(t)){
      userData.streak.push(t);
      updateStreakRecord();
      scheduleSave();
      // Uyarı banner'ını kaldır
      const banner=document.getElementById("noChallengeWarning");
      if(banner) banner.remove();
    }
    const btn = document.getElementById("timerBtn");
    if(btn){ btn.textContent="⏸ Durdur"; btn.style.background="#ff4757"; }
    const dot = document.getElementById("timerDot");
    if(dot) dot.style.animation="pulse 1s infinite";
  } else {
    const elapsed = Math.floor((Date.now()-timerStart)/1000);
    timerElapsed += elapsed;
    // save to userData
    if(!userData.studySeconds) userData.studySeconds={};
    userData.studySeconds[todayKey()] = (userData.studySeconds[todayKey()]||0) + elapsed;
    timerStart = null;
    timerRunning = false;
    clearInterval(timerInterval);
    scheduleSave();
    const btn = document.getElementById("timerBtn");
    if(btn){ btn.textContent="▶ Başlat"; btn.style.background="#2ed573"; }
    const dot = document.getElementById("timerDot");
    if(dot) dot.style.animation="none";
    timerTick();
  }
}
function timerReset(){
  if(timerRunning){
    clearInterval(timerInterval);
    timerRunning=false;
    timerStart=null;
    timerInterval=null;
  }
  timerElapsed=0;
  const btn=document.getElementById("timerBtn");
  if(btn){ btn.textContent="▶ Başlat"; btn.style.background="#2ed573"; }
  const dot=document.getElementById("timerDot");
  if(dot) dot.style.animation="none";
  timerTick();
}

function weekStudySeconds(){
  const ss = userData.studySeconds||{};
  let total=0;
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const k=todayKeyForDate(d);
    total+=(ss[k]||0);
  }
  return total;
}
function updateStreakRecord(){
  const cur=countStreak(userData.streak||[]);
  if(cur>(userData.streakRecord||0)){
    userData.streakRecord=cur;
  }
}


// ── TOGGLE TOPIC ─────────────────────────────────────────────
function toggleTopic(subj,i){
  const key=subj+":"+i;
  const wasDone=!!userData.done[key];
  const xpAmt=SUBJECTS[subj].xp;
  userData.done[key]=!wasDone;
  const t=todayStr();
  if(!userData.streak) userData.streak=[];
  if(!userData.streak.includes(t)) userData.streak.push(t);
  updateStreakRecord();
  if(!wasDone){
    userData.xp+=xpAmt;
    const s=calcStats();
    const p=s.total/s.all;
    let em="✅",ti="KONU TAMAM!",tx="Harika! Bir adım daha attın. Devam et!";
    if(s.total===1){em="⭐";ti="İLK ADIM!";tx="İlk konunu tamamladın. Her büyük yolculuk bir adımla başlar.";}
    else if(s.total===5){em="🔥";ti="MOMENTUM!";tx="5 konu bitti! Ateş yanıyor, durma.";}
    else if(s.total===10){em="💪";ti="ÇALIŞIYOR!";tx="10 konu tamam. Ritim tutturuldu.";}
    else if(p>=0.25&&p<0.27){em="💎";ti="ÇEYREĞİ GEÇTİN!";tx="Konuların %25'ini tamamladın. İnanılmaz!";}
    else if(p>=0.50&&p<0.52){em="🚀";ti="YARIYA GELDİN!";tx="%50 tamamlandı. Çoğu insan bu noktaya gelemez.";}
    else if(p>=0.75&&p<0.77){em="👑";ti="NEREDEYSE BİTTİ!";tx="%75 tamamlandı. Zirve görünüyor!";}
    else if(p>=1){em="🏆";ti="EFSANE!";tx="Tüm konuları tamamladın. Sen artık başka birisin.";}
    showReward(em,ti,tx,xpAmt);
  } else {
    userData.xp=Math.max(0,userData.xp-xpAmt);
  }
  scheduleSave();
  renderTopics();
  renderStats();
}

async function doRegister(){
  const nameEl=document.getElementById("authName");
  const name=nameEl?nameEl.value.trim():"";
  const email=document.getElementById("authEmail").value.trim();
  const pass=document.getElementById("authPass").value;
  const err=document.getElementById("authErr");
  if(!name||!email||!pass){ err.textContent="Tüm alanları doldur!"; return; }
  if(pass.length<6){ err.textContent="Şifre en az 6 karakter olmalı!"; return; }
  err.textContent="Kayıt yapılıyor...";
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(cred.user,{displayName:name});
    // Yeni kullanıcı için HER ZAMAN temiz veri yaz — bellekteki userData'yı kullanma
    const freshData = { done:{}, xp:0, streak:[], name:name, studySeconds:{}, exams:[], weeklyGoalHours:8, streakRecord:0 };
    await setDoc(doc(db,"users",cred.user.uid), freshData);
  } catch(e){
    if(e.code==="auth/email-already-in-use") err.textContent="Bu e-posta zaten kayıtlı!";
    else if(e.code==="auth/invalid-email") err.textContent="Geçersiz e-posta adresi!";
    else err.textContent="Hata: "+e.message;
  }
}
async function doLogin(){
  const email=document.getElementById("authEmail").value.trim();
  const pass=document.getElementById("authPass").value;
  const err=document.getElementById("authErr");
  err.textContent="Giriş yapılıyor...";
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  } catch(e){
    if(e.code==="auth/invalid-credential"||e.code==="auth/wrong-password") err.textContent="E-posta veya şifre hatalı!";
    else if(e.code==="auth/user-not-found") err.textContent="Bu e-posta ile kayıtlı kullanıcı yok!";
    else if(e.code==="auth/invalid-email") err.textContent="Geçersiz e-posta adresi!";
    else err.textContent="Hata: "+e.message;
  }
}
async function doForgotPassword(){
  const email=document.getElementById("authEmail").value.trim();
  const err=document.getElementById("authErr");
  if(!email){ err.style.color="#ffd60a"; err.textContent="E-posta adresini gir, sıfırlama maili gönderelim."; return; }
  try{
    await sendPasswordResetEmail(auth, email);
    err.style.color="#2ed573";
    err.textContent="✅ Sıfırlama maili gönderildi! Spam kutunu da kontrol et.";
  } catch(e){
    err.style.color="#ff4757";
    if(e.code==="auth/user-not-found") err.textContent="Bu e-posta ile kayıtlı kullanıcı bulunamadı.";
    else if(e.code==="auth/invalid-email") err.textContent="Geçersiz e-posta adresi.";
    else err.textContent="Hata: "+e.message;
  }
}

// ── RENDER STATS ──────────────────────────────────────────────
function renderStats(){
  const s=calcStats();
  const {lvl,idx,next,pct}=getLevel(userData.xp);
  const tytPct=s.tT?Math.round(s.tD/s.tT*100):0;
  const aytPct=s.aT?Math.round(s.aD/s.aT*100):0;
  elSet("sTotalDone",s.total);
  elSet("sTotalLeft",s.all-s.total);
  elSet("sXP",userData.xp);
  elSet("sStreak",countStreak(userData.streak||[])+" 🔥");
  elSet("sLevelBadge","LVL "+(idx+1));
  elSet("sLevelName",lvl.name);
  elSet("sXPLabel",userData.xp+" / "+next.min+" XP");
  barSet("xpBar",pct,"linear-gradient(90deg,#ffd60a,#14b8a6)");
  barSet("tytBar",tytPct,"#6366f1");
  barSet("aytBar",aytPct,"#14b8a6");
  pctSet("tytPct",tytPct);
  pctSet("aytPct",aytPct);
  buildStreakRow();
}
function buildStreakRow(){
  const streakRow=document.getElementById("streakRow");
  if(!streakRow) return;
  streakRow.innerHTML="";
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()-6+i);
    const ds=d.toDateString();
    const isDone=(userData.streak||[]).includes(ds);
    const isToday=ds===todayStr();
    const div=document.createElement("div");
    div.style.cssText=`width:32px;height:32px;border-radius:6px;display:flex;align-items:center;
      justify-content:center;font-family:monospace;font-size:0.65rem;font-weight:600;
      background:${isDone?"#2ed573":"transparent"};
      border:1px solid ${isDone?"#2ed573":isToday?"#6366f1":"rgba(255,255,255,0.1)"};
      color:${isDone?"#000":isToday?"#6366f1":"#5a6a7e"};`;
    div.textContent=d.getDate();
    if(isToday){
      const label=document.createElement("div");
      label.style.cssText=`font-family:monospace;font-size:0.55rem;color:#6366f1;text-align:center;margin-top:3px;`;
      label.textContent="bugün";
      const wrap=document.createElement("div");
      wrap.style.cssText="display:flex;flex-direction:column;align-items:center;";
      wrap.appendChild(div);
      wrap.appendChild(label);
      streakRow.appendChild(wrap);
    } else {
      streakRow.appendChild(div);
    }
  }
}

function barSet(id,w,clr){ const e=document.getElementById(id); if(e){e.style.width=w+"%";e.style.background=clr;} }

function renderTopics(searchQuery=""){
  const list=document.getElementById("topicList");
  if(!list) return;
  list.innerHTML="";

  // If searching, show across ALL subjects
  if(searchQuery){
    let found=0;
    Object.entries(TOPICS).forEach(([subKey,topics])=>{
      const sub=SUBJECTS[subKey];
      topics.forEach((name,i)=>{
        if(!name.toLowerCase().includes(searchQuery)) return;
        found++;
        const isDone=!!userData.done[subKey+":"+i];
        const d=document.createElement("div");
        d.style.cssText=`display:flex;align-items:center;gap:10px;

function dashNetChartSvg(exams){
  const tyt=exams.filter(x=>x.type==="tyt").slice(-8);
  const ayt=exams.filter(x=>x.type==="ayt").slice(-8);
  const base=(tyt.length>=2?tyt:ayt);
  const n=Math.max(base.length,2);
  const W=430,H=170,p={l:32,r:10,t:12,b:28},cw=W-p.l-p.r,ch=H-p.t-p.b;
  const vals=[...tyt.map(calcExamTotals),...ayt.map(calcExamTotals)];
  const max=Math.max(100,...vals,1), min=0;
  const y=v=>p.t+ch-(v-min)/(max-min)*ch;
  const grid=[0,25,50,75,100].map(v=>{
    const yy=y(v).toFixed(1);
    return `<line x1="${p.l}" y1="${yy}" x2="${W-p.r}" y2="${yy}" stroke="rgba(255,255,255,.07)"/><text x="${p.l-7}" y="${+yy+3}" text-anchor="end" fill="#8b99a5" font-size="8">${v}</text>`;
  }).join("");
  function series(arr,color){
    if(arr.length<2) return "";
    const pts=arr.map((e,i)=>[p.l+i/(arr.length-1)*cw,y(calcExamTotals(e))]);
    const d=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`+
      pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" fill="${color}" stroke="#0d1419" stroke-width="2"/>`).join("");
  }
  const xlabels=base.map((e,i)=>`<text x="${(p.l+i/Math.max(base.length-1,1)*cw).toFixed(1)}" y="${H-6}" text-anchor="middle" fill="#82919d" font-size="8">${escapeHtml(e.date.slice(5))}</text>`).join("");
  return `<svg class="line-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${series(tyt,"#ff7a1a")}${series(ayt,"#4ca3ff")}${xlabels}</svg>`;
}

let examFormType=null, examEditIdx=null;

const TYT_EXAM_SUBJECTS=[
  {key:"tyt-turk",label:"Türkçe",   total:40},
  {key:"tyt-sos", label:"Sosyal",   total:20},
  {key:"tyt-mat", label:"Matematik",total:40},
  {key:"tyt-fen", label:"Fen",      total:20},
];
const AYT_EXAM_SUBJECTS=[
  {key:"ayt-mat", label:"Matematik",total:30},
  {key:"ayt-geo", label:"Geometri", total:10},
  {key:"ayt-fiz", label:"Fizik",    total:14},
  {key:"ayt-kim", label:"Kimya",    total:13},
  {key:"ayt-bio", label:"Biyoloji", total:13},
];
function calcNet(d,y){
  const dd=Math.max(0,Number(d)||0);
  const yy=Math.max(0,Number(y)||0);
  return dd-yy/4;
}
function calcExamTotals(exam){
  const subs=exam.type==="tyt"?TYT_EXAM_SUBJECTS:AYT_EXAM_SUBJECTS;
  let t=0; subs.forEach(s=>{ t+=calcNet(exam.scores?.[s.key]?.d||0, exam.scores?.[s.key]?.y||0); }); return Math.round(t*100)/100;
}

function showExamForm(type, editIdx=null){

  const color=type==="tyt"?"#6366f1":"#14b8a6";
  form.innerHTML=`
    <div style="font-size:0.72rem;font-weight:700;letter-spacing:3px;color:${color};margin-bottom:16px;font-family:monospace;">
      ${editIdx!==null?"✏️ DÜZENLE":"📋 YENİ DENEME"} — ${type.toUpperCase()}

      </div>
      <div style="flex:1;min-width:180px;">
        <div style="font-family:monospace;font-size:0.65rem;color:#5a6a7e;margin-bottom:4px;">DENEME ADI</div>
        <input id="examName" type="text" placeholder="örn. TYT Deneme #1" value="${ex?.name||""}"
          style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px 12px;color:#e8edf5;font-family:inherit;font-size:0.85rem;outline:none;box-sizing:border-box;">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-bottom:20px;">
      ${subs.map(s=>{
        const d=ex?.scores?.[s.key]?.d||0, y=ex?.scores?.[s.key]?.y||0;
        return `<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:14px;">
          <div style="font-family:monospace;font-size:0.7rem;color:${color};margin-bottom:6px;font-weight:700;">${s.label} <span style="color:#5a6a7e;font-weight:400;">(${s.total})</span></div>

                style="width:100%;background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.2);border-radius:6px;padding:7px;color:#ff4757;font-family:monospace;font-size:1rem;font-weight:700;text-align:center;outline:none;box-sizing:border-box;"></div>
          </div>

function saveExam(){
  const type=examFormType;
  const subs=type==="tyt"?TYT_EXAM_SUBJECTS:AYT_EXAM_SUBJECTS;
  const scores={};
  for(const s of subs){
    const d=Math.max(0,Math.min(s.total,parseInt(document.getElementById("d_"+s.key)?.value)||0));
    const y=Math.max(0,Math.min(s.total-d,parseInt(document.getElementById("y_"+s.key)?.value)||0));
    scores[s.key]={d,y};
  }
  const exam={
    type,
    date:document.getElementById("examDate").value||todayKey(),
    name:document.getElementById("examName").value.trim()||`${type.toUpperCase()} Denemesi`,
    scores
  };
  if(!userData.exams) userData.exams=[];
  if(examEditIdx!==null) userData.exams[examEditIdx]=exam; else userData.exams.push(exam);
  scheduleSave();
  document.getElementById("examForm").style.display="none";
  examFormType=null; examEditIdx=null;
  renderExamList();
}

  }
  html+=`<div style="display:flex;flex-direction:column;gap:14px;">`;

function drawNetChart(container,tytE,aytE){
  const allNets=[...tytE.map(e=>calcExamTotals(e)),...aytE.map(e=>calcExamTotals(e))];
  const maxNet=Math.max(...allNets,1);
  const minNet=Math.min(...allNets,0);
  const range=Math.max(maxNet-minNet,1);
  const cnt=Math.max(tytE.length,aytE.length,2);
  const W=Math.max(500,cnt*80),H=180,pad={l:36,r:16,t:16,b:32};
  const cW=W-pad.l-pad.r, cH=H-pad.t-pad.b;

  // y position: higher net = higher on screen (lower y value)
  function yPos(net){ return pad.t + cH - ((net-minNet)/range)*cH; }
  function pts(ex){ if(ex.length<2) return null; return ex.map((e,i)=>[ pad.l+(i/(ex.length-1))*cW, yPos(calcExamTotals(e)) ]); }
  function polyline(p,c){
    if(!p) return "";
    const d=p.map((pt,i)=>(i===0?"M":"L")+pt[0].toFixed(1)+","+pt[1].toFixed(1)).join(" ");
    // value labels above each point
    const labels=p.map((pt,i)=>{
      const ex=(c==="#6366f1"?tytE:aytE)[i];
      return `<text x="${pt[0].toFixed(1)}" y="${(pt[1]-8).toFixed(1)}" text-anchor="middle" fill="${c}" font-size="9" font-family="monospace" font-weight="600">${calcExamTotals(ex).toFixed(1)}</text>`;
    }).join("");
    return `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${p.map(pt=>`<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="4" fill="${c}" stroke="#0a0a12" stroke-width="1.5"/>`).join("")}
      ${labels}`;
  }
  const lSrc=tytE.length>=aytE.length?tytE:aytE;
  const xLabels=lSrc.map((e,i)=>{
    const x=(pad.l+(i/Math.max(lSrc.length-1,1))*cW).toFixed(1);
    return `<text x="${x}" y="${H-6}" text-anchor="middle" fill="#5a6a7e" font-size="10" font-family="monospace">${e.date.slice(5)}</text>`;
  }).join("");
  const grid=[0,0.25,0.5,0.75,1].map(f=>{
    const netVal=minNet+f*range;
    const y=(pad.t+cH-f*cH).toFixed(1);
    return `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3,3"/>
      <text x="${(pad.l-4)}" y="${(parseFloat(y)+3).toFixed(1)}" text-anchor="end" fill="rgba(255,255,255,0.25)" font-size="9" font-family="monospace">${netVal.toFixed(0)}</text>`;
  }).join("");

  container.innerHTML=`
  <svg width="${W}" height="${H}" style="min-width:${W}px;display:block;">
    ${grid}
    ${polyline(pts(tytE),"#6366f1")}
    ${polyline(pts(aytE),"#14b8a6")}
    ${xLabels}
  </svg>
  <div style="display:flex;gap:16px;margin-top:8px;">
    ${tytE.length>0?`<div style="display:flex;align-items:center;gap:6px;"><div style="width:14px;height:3px;background:#6366f1;border-radius:2px;"></div><span style="font-family:monospace;font-size:0.65rem;color:#5a6a7e;">TYT</span></div>`:""}
    ${aytE.length>0?`<div style="display:flex;align-items:center;gap:6px;"><div style="width:14px;height:3px;background:#14b8a6;border-radius:2px;"></div><span style="font-family:monospace;font-size:0.65rem;color:#5a6a7e;">AYT</span></div>`:""}
  </div>`;
}

// ── DONUT CHART ───────────────────────────────────────────────
function makeDonut(pct, color, size=72){
  const r=28, cx=size/2, cy=size/2;
  const circ=2*Math.PI*r;
  const dash=circ*(pct/100);
  const gap=circ-dash;
  // start from top (-90deg = -PI/2)
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="7"
      stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}"
      stroke-dashoffset="${(circ*0.25).toFixed(2)}"
      stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"
      style="transition:stroke-dasharray 0.8s ease;"/>
    <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle"
      fill="${color}" font-size="11" font-family="monospace" font-weight="700">${pct}%</text>
  </svg>`;
}

function renderDonutSection(){

function seed(){
 const base=[
  ["TYT Matematik","Problemler","45 dk"],
  ["TYT Türkçe","Paragraf","30 soru"],
  ["AYT Matematik","Türev / eksik konu","45 dk"],
  ["Genel","Yanlış analizi","20 dk"]
 ];
 D.tasks=base.map((x,i)=>({id:Date.now()+i,title:x[0]+" — "+x[1],detail:x[2],done:false}));
 save();renderTasks();
}
function renderTasks(){
 const el=document.getElementById("yksTasks"); if(!el)return;
 if(!D.tasks.length){el.innerHTML='<div class="yks-empty">Henüz plan yok. “Plan Oluştur” ile başlayabilirsin.</div>';return}
 const done=D.tasks.filter(x=>x.done).length,pct=Math.round(done/D.tasks.length*100);
 el.innerHTML='<div class="yks-progress"><span style="width:'+pct+'%"></span></div>'+
 D.tasks.map(x=>`<div class="yks-item"><input class="yks-check" type="checkbox" ${x.done?'checked':''} data-task="${x.id}"><div class="grow"><b>${esc(x.title)}</b><br><small>${esc(x.detail)}</small></div><span class="yks-tag">${x.done?'Tamamlandı':'Planlandı'}</span></div>`).join("");
 el.querySelectorAll("[data-task]").forEach(c=>c.onchange=()=>{const t=D.tasks.find(x=>x.id==c.dataset.task);if(t){t.done=c.checked;save();renderTasks()}});
}
function addMistake(){
 const subject=document.getElementById("mSubject").value.trim(),topic=document.getElementById("mTopic").value.trim(),reason=document.getElementById("mReason").value.trim(),note=document.getElementById("mNote").value.trim();
 if(!subject||!topic)return alert("Ders ve konu alanlarını doldur.");
 D.mistakes.unshift({id:Date.now(),subject,topic,reason,note,next:addDays(today(),2),done:false});save();["mSubject","mTopic","mReason","mNote"].forEach(id=>document.getElementById(id).value="");render();
}
function renderMistakes(){
 const el=document.getElementById("yksMistakes");if(!el)return;
 el.innerHTML=D.mistakes.length?D.mistakes.slice(0,20).map(x=>`<div class="yks-item"><div class="grow"><b>${esc(x.subject)} · ${esc(x.topic)}</b><br><small>${esc(x.reason||"Neden belirtilmedi")} · Tekrar: ${esc(x.next)}</small>${x.note?`<br><small>${esc(x.note)}</small>`:""}</div><button class="yks-btn ${x.done?'':'primary'}" data-m="${x.id}">${x.done?'✓':'Tekrar'}</button></div>`).join(""):'<div class="yks-empty">Henüz yanlış eklenmedi.</div>';
 el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const x=D.mistakes.find(x=>x.id==b.dataset.m);if(x){x.done=true;x.next=addDays(today(),7);save();renderMistakes()}});
}
function addTopic(){
 const s=document.getElementById("tSubject").value.trim(),t=document.getElementById("tTopic").value.trim(),l=document.getElementById("tLevel").value;if(!s||!t)return alert("Ders ve konu alanlarını doldur.");D.topics[s+"|"+t]={subject:s,topic:t,level:l};save();renderTopics();
}
function renderTopics(){
 const el=document.getElementById("yksTopics");if(!el)return;const a=Object.values(D.topics);
 el.innerHTML=a.length?a.map(x=>`<div class="yks-item"><div class="grow"><b>${esc(x.subject)} · ${esc(x.topic)}</b></div><span class="yks-tag ${x.level}">${x.level==="red"?"Eksik":x.level==="yellow"?"Geliştirilmeli":"İyi"}</span></div>`).join(""):'<div class="yks-empty">Konu durumlarını buradan ekleyebilirsin.</div>';
}
function addSession(){
 const date=document.getElementById("sDate").value||today(),net=Number(document.getElementById("sNet").value);if(!Number.isFinite(net)||net<0)return alert("Geçerli bir net gir.");
 D.sessions.push({date,net});D.sessions=D.sessions.slice(-30);save();renderChart();renderHeat();
}
function renderChart(){
 const el=document.getElementById("yksChart");if(!el)return;const a=D.sessions.slice(-14),max=Math.max(1,...a.map(x=>x.net));
 el.innerHTML=a.length?a.map(x=>`<div class="yks-bar" style="height:${Math.max(5,x.net/max*92)}%" title="${esc(x.date)}: ${x.net} net"><span>${x.net}</span></div>`).join(""):'<div class="yks-empty" style="width:100%">Henüz deneme verisi yok.</div>';
}
function renderHeat(){
 const el=document.getElementById("yksHeat");if(!el)return;
 const map={};D.sessions.forEach(x=>{map[x.date]=(map[x.date]||0)+1});
 let out="";for(let i=55;i>=0;i--){const d=addDays(today(),-i),n=map[d]||0;out+=`<div class="yks-day" data-level="${Math.min(4,n)}" title="${d}: ${n} kayıt"></div>`}el.innerHTML=out;
}
function renderGoal(){
 const r=document.getElementById("yksRank"),t=document.getElementById("yksTyt"),a=document.getElementById("yksAyt"),o=document.getElementById("yksGoalOut");if(!r)return;
 r.value=D.targetRank||"";t.value=D.targetTyt||"";a.value=D.targetAyt||"";
 o.textContent=D.targetRank?`Hedef sıralaman: ${D.targetRank} · TYT: ${D.targetTyt||"—"} · AYT: ${D.targetAyt||"—"}`:"Henüz hedef kaydedilmedi.";
}
function saveGoal(){D.targetRank=document.getElementById("yksRank").value.trim();D.targetTyt=document.getElementById("yksTyt").value;D.targetAyt=document.getElementById("yksAyt").value;save();renderGoal()}
function ask(){
 const q=document.getElementById("yksAsk").value.toLowerCase(),o=document.getElementById("yksAnswer"),weak=Object.values(D.topics).filter(x=>x.level==="red").slice(0,3),pending=D.tasks.filter(x=>!x.done).length;
 let ans;
 if(q.includes("bugün")||q.includes("çalış")) ans=weak.length?`Önceliği eksik konularına ver: ${weak.map(x=>x.subject+" / "+x.topic).join(", ")}. Ardından ${pending} plan görevinden kalanları tamamla.`:`Önce planındaki görevleri tamamla; ardından son denemendeki yanlışlarını tekrar et.`;
 else if(q.includes("mat")) ans="Matematik için kısa bir blok önerisi: 10 dk konu tekrarı + 30–45 dk soru çözümü + 10 dk yanlış analizi.";
 else if(q.includes("yanlış")) ans=D.mistakes.length?`Yanlış defterinde ${D.mistakes.length} kayıt var. Bugün tekrar tarihi gelenleri gözden geçir.`:"Önce yanlış defterine birkaç kayıt ekle; böylece tekrar planı oluşturabilirsin.";
 else ans="Sorunu biraz daha açık yaz. Örneğin “Bugün ne çalışmalıyım?”, “Matematik için plan yap” veya “Yanlışlarımı nasıl tekrar edeyim?”";
 o.innerHTML=`<div class="grow">${esc(ans)}</div>`;
}
function bind(){
 document.querySelectorAll("#yksProFeatures [data-act]").forEach(b=>b.onclick=()=>({seed,goal:saveGoal,mistake:addMistake,topic:addTopic,session:addSession,ask})[b.dataset.act]());
 const sd=document.getElementById("sDate");if(sd)sd.value=today();
}
function render(){renderTasks();renderMistakes();renderTopics();renderChart();renderHeat();renderGoal()}
/* dashboard now owns the Pro layout; legacy auto-mount disabled to prevent duplicate UI */
})();
</script>

function addMistake(){const s=mSubject.value.trim(),t=mTopic.value.trim();if(!s||!t)return alert("Ders ve konu alanlarını doldur.");D.mistakes=[{id:Date.now(),subject:s,topic:t,reason:mReason.value.trim(),note:mNote.value.trim(),next:addDays(localDate(),2),done:false},...(D.mistakes||[])].slice(0,100);save();mSubject.value=mTopic.value=mReason.value=mNote.value="";renderMistakes()}
function renderMistakes(){const el=document.getElementById("yksMistakes");if(!el)return;const a=D.mistakes||[];el.innerHTML=a.length?a.slice(0,15).map(x=>`<div class="yks-item"><div class="grow"><b>${esc(x.subject)} · ${esc(x.topic)}</b><br><small>${esc(x.reason||"Neden belirtilmedi")} · Tekrar: ${esc(x.next)}</small>${x.note?`<br><small>${esc(x.note)}</small>`:""}</div><button class="yks-btn ${x.done?"":"primary"}" data-ym="${x.id}">${x.done?"✓ Tekrarlandı":"Tekrar"}</button></div>`).join(""):'<div class="yks-empty">Henüz yanlış kaydı yok.</div>';el.querySelectorAll("[data-ym]").forEach(b=>b.onclick=()=>{const x=a.find(v=>String(v.id)===String(b.dataset.ym));if(x){x.done=true;x.next=addDays(localDate(),7);save();renderMistakes()}})}
function addTopic(){const s=tSubject.value.trim(),t=tTopic.value.trim();if(!s||!t)return alert("Ders ve konu alanlarını doldur.");D.topics=D.topics||{};D.topics[s+"|"+t]={subject:s,topic:t,level:tLevel.value};save();renderTopics()}
function renderTopics(){const el=document.getElementById("yksTopics");if(!el)return;const a=Object.values(D.topics||{});el.innerHTML=a.length?a.map(x=>`<div class="yks-item"><div class="grow"><b>${esc(x.subject)} · ${esc(x.topic)}</b></div><span class="yks-tag ${x.level}">${x.level==="red"?"Eksik":x.level==="yellow"?"Geliştirilmeli":"İyi"}</span></div>`).join(""):'<div class="yks-empty">Konu durumlarını ekleyebilirsin.</div>'}
function addSession(){const n=Number(sNet.value);if(!Number.isFinite(n)||n<0)return alert("Geçerli bir net gir.");D.sessions=[...(D.sessions||[]),{date:sDate.value||localDate(),net:n}].slice(-30);save();renderChart();renderHeat()}
function renderChart(){const el=document.getElementById("yksChart");if(!el)return;const a=(D.sessions||[]).slice(-14),max=Math.max(1,...a.map(x=>x.net));el.innerHTML=a.length?a.map(x=>`<div class="yks-bar" style="height:${Math.max(5,x.net/max*92)}%" title="${esc(x.date)}: ${x.net} net"><span>${x.net}</span></div>`).join(""):'<div class="yks-empty" style="width:100%">Henüz deneme verisi yok.</div>'}
function renderHeat(){const el=document.getElementById("yksHeat");if(!el)return;const map={};(D.sessions||[]).forEach(x=>map[x.date]=(map[x.date]||0)+1);let o="";for(let i=55;i>=0;i--){const d=addDays(localDate(),-i),n=map[d]||0;o+=`<div class="yks-day" data-level="${Math.min(4,n)}" title="${d}: ${n} kayıt"></div>`}el.innerHTML=o}
function renderGoal(){
  const r=document.getElementById("yksRank"),t=document.getElementById("yksTyt"),a=document.getElementById("yksAyt"),o=document.getElementById("yksGoalOut");
  if(r){r.value=D.targetRank||"";} if(t){t.value=D.targetTyt||"";} if(a){a.value=D.targetAyt||"";}
  const rd=document.getElementById("yksRankDisplay"),td=document.getElementById("yksTytDisplay"),ad=document.getElementById("yksAytDisplay");
  if(rd) rd.textContent=D.targetRank||"50.000"; if(td) td.textContent=D.targetTyt||"80"; if(ad) ad.textContent=D.targetAyt||"60";
  if(o) o.textContent=D.targetRank?`Hedef: ${D.targetRank} sıralama · TYT ${D.targetTyt||"—"} · AYT ${D.targetAyt||"—"}`:"Henüz hedef kaydedilmedi.";
}
function saveGoal(){
  const r=document.getElementById("yksRank")||document.getElementById("yksRankLegacy"),t=document.getElementById("yksTyt")||document.getElementById("yksTytLegacy"),a=document.getElementById("yksAyt")||document.getElementById("yksAytLegacy");
  D.targetRank=(r?.value||"").trim();D.targetTyt=t?.value||"";D.targetAyt=a?.value||"";save();renderGoal();
}
function ask(){const q=yksAsk.value.toLocaleLowerCase("tr-TR"),weak=Object.values(D.topics||{}).filter(x=>x.level==="red"),pending=(D.tasks||[]).filter(x=>!x.done).length;let a;if(q.includes("bugün")||q.includes("çalış"))a=weak.length?`Öncelik eksik konuların: ${weak.slice(0,3).map(x=>x.subject+" / "+x.topic).join(", ")}. Sonra kalan ${pending} plan görevinden en önemlisini tamamla.`:`Önce planındaki ${pending} görevi tamamla; ardından yanlış defterinden tekrar tarihi gelenleri çalış.`;else if(q.includes("mat"))a="Matematik için: 10 dk konu tekrarı + 30–45 dk soru çözümü + 10 dk yanlış analizi.";else if(q.includes("yanlış"))a=(D.mistakes||[]).length?`Yanlış defterinde ${(D.mistakes||[]).length} kayıt var. Tekrar tarihi gelenlerden başla.`:"Yanlış defterine kayıt ekleyerek tekrar sistemini kullanabilirsin.";else a="Örnek sorular: “Bugün ne çalışmalıyım?”, “Matematik için plan yap”, “Yanlışlarımı nasıl tekrar edeyim?”";yksAnswer.innerHTML=`<div class="grow">${esc(a)}</div>`}
function bind(){
  document.querySelectorAll("#yksProFeatures [data-ypro]").forEach(b=>b.onclick=()=>({seed,goal:saveGoal,mistake:addMistake,topic:addTopic,session:addSession,ask})[b.dataset.ypro]());
  const sd=document.getElementById("sDate"); if(sd) sd.value=localDate();
  const planBtn=document.getElementById("yksPlanEditVisual");
  if(planBtn) planBtn.onclick=()=>{
    const ed=document.getElementById("yksGoalFullEditor");
    if(ed){ed.style.display=ed.style.display==="none"?"block":"none";renderGoal();}
  };
  renderGoal();
}
function renderAll(){renderTasks();renderMistakes();renderTopics();renderChart();renderHeat();renderGoal()}
window.mountYksProDashboard=function(){
 if(typeof activePage!=="undefined"&&activePage!=="dashboard")return;
 const host=document.querySelector("#yksProMount");
 if(!host)return;
 host.innerHTML=panelMarkup();bind();renderAll();
};
})();
</script>
