<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YKSKoç — Takip Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#090d16;--bg2:#111827;--bg3:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#f3f4f6;--text2:#9ca3af;--text3:#6b7280;
  --accent:#3b82f6;--accent2:#f97316;--glow:rgba(59,130,246,0.15);
}
body.light{
  --bg:#f8fafc;--bg2:#ffffff;--bg3:rgba(0,0,0,0.02);
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.12);
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --glow:rgba(59,130,246,0.08);
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;transition:background 0.3s,color 0.3s;
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 24px 24px;
}
#root{position:relative;z-index:1;}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cfFall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes popIn{from{transform:translateY(20px) scale(0.95);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px;}

/* Modern Motivasyon Pop-Up */
#motivationPopup {
  position: fixed; bottom: 24px; right: 24px; z-index: 900;
  max-width: 340px; width: calc(100% - 48px);
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 16px; padding: 20px;
  box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3), 0 8px 10px -6px rgba(0,0,0,0.3);
  backdrop-filter: blur(12px); animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column; gap: 10px;
}
#motivationPopup.hidden { display: none; }
.popup-header { display: flex; justify-content: space-between; align-items: center; }
.popup-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
.popup-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1.1rem; }
.popup-close:hover { color: var(--text); }
.popup-body { font-size: 0.92rem; color: var(--text); line-height: 1.5; font-weight: 500; }

/* Dashboard Stilleri */
.container{max-width:1100px;margin:0 auto;padding:24px 16px 80px 16px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;background:var(--bg2);padding:16px 24px;border-radius:16px;border:1px solid var(--border);}
.nav-tabs{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto;padding-bottom:8px;}
.tab-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text2);padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:600;white-space:nowrap;transition:all 0.2s;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:768px){.grid-2{grid-template-columns:1fr;}}

.topic-list{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.topic-card{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all 0.2s;}
.topic-card:hover{border-color:var(--border2);transform:translateX(4px);}
.topic-card.done{opacity:0.6;background:rgba(16,185,129,0.05);border-color:rgba(16,185,129,0.2);}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
.topic-card.done .checkbox{background:#10b981;border-color:#10b981;}

.btn-primary{background:var(--accent);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer;}
.input-field{width:100%;background:var(--bg3);border:1px solid var(--border2);padding:12px;border-radius:10px;color:var(--text);margin-bottom:12px;outline:none;}
.input-field:focus{border-color:var(--accent);}
</style>
</head>
<body>
<div id="root"></div>

<!-- Motivasyon Pop-Up -->
<div id="motivationPopup">
  <div class="popup-header">
    <span class="popup-title">⚡ Günün Motivasyonu</span>
    <button class="popup-close" onclick="closeMotivation()">✕</button>
  </div>
  <div class="popup-body" id="motivationText">...</div>
</div>

<div id="rewardOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(8px);">
  <div class="rbox" style="background:var(--bg2);border:1px solid #ffd60a;
    border-radius:24px;padding:40px;text-align:center;max-width:400px;width:90%;
    box-shadow:0 0 50px rgba(255,214,10,0.2);transform:scale(0.8);transition:transform 0.3s;">
    <div id="rEmoji" style="font-size:3.5rem;margin-bottom:12px;">🎉</div>
    <div id="rTitle" style="font-size:1.5rem;font-weight:800;color:#ffd60a;margin-bottom:8px;">HARİKA!</div>
    <div id="rText" style="color:var(--text2);font-size:0.95rem;line-height:1.6;margin-bottom:16px;"></div>
    <div id="rXP" style="font-family:'JetBrains Mono',monospace;font-size:1.1rem;color:#2ed573;margin-bottom:24px;"></div>
    <button id="rewardBtn" onclick="closeReward()" style="background:#ffd60a;border:none;color:#000;
      padding:12px 32px;border-radius:12px;font-weight:800;cursor:pointer;font-size:0.9rem;width:100%;">
      DEVAM ET 💪</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, browserSessionPersistence, setPersistence, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTcsGoXARld4-IQpzst-27bNzzHTJMGbU",
  authDomain: "ykskoc47.firebaseapp.com",
  projectId: "ykskoc47",
  storageBucket: "ykskoc47.firebasestorage.app",
  messagingSenderId: "950563682553",
  appId: "1:950563682553:web:941c5c6b8d0a7a10134a28"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserSessionPersistence).catch(()=>{});

const MOTIVATION_QUOTES = [
  "Vazgeçmediğin sürece kaybetmezsin.",
  "Gelecek, bugünden hazırlananlara aittir.",
  "Bugün yapacağın ekstra bir saatlik çalışma, yarınki farkını yaratacak.",
  "Zorluklar, başarının değerini artıran süslerdir.",
  "Disiplin, ne istediğin ile en çok ne istediğin arasında seçim yapmaktır.",
  "Başarı, her gün tekrarlanan küçük çabaların toplamıdır."
];

function initMotivation(){
  const quote = MOTIVATION_QUOTES[Math.floor(Math.random() * MOTIVATION_QUOTES.length)];
  const el = document.getElementById("motivationText");
  if(el) el.textContent = `"${quote}"`;
}
window.closeMotivation = function(){
  document.getElementById("motivationPopup")?.classList.add("hidden");
};
window.closeReward = function(){
  const el = document.getElementById("rewardOverlay");
  el.style.opacity = "0"; el.style.pointerEvents = "none";
};

const SUBJECTS = {
  "tyt-mat":  { label:"TYT Matematik",  type:"tyt", xp:10, color:"#3b82f6" },
  "tyt-geo":  { label:"TYT Geometri",   type:"tyt", xp:10, color:"#0EA5E9" },
  "tyt-fen":  { label:"TYT Fen",        type:"tyt", xp:10, color:"#10B981" },
  "tyt-turk": { label:"TYT Türkçe",     type:"tyt", xp:10, color:"#8B5CF6" },
  "tyt-sos":  { label:"TYT Sosyal",     type:"tyt", xp:8,  color:"#F59E0B" },
  "ayt-mat":  { label:"AYT Matematik",  type:"ayt", xp:15, color:"#EF4444" },
  "ayt-geo":  { label:"AYT Geometri",   type:"ayt", xp:15, color:"#F97316" },
  "ayt-fiz":  { label:"AYT Fizik",      type:"ayt", xp:15, color:"#EC4899" },
  "ayt-kim":  { label:"AYT Kimya",      type:"ayt", xp:15, color:"#F43F5E" },
  "ayt-bio":  { label:"AYT Biyoloji",   type:"ayt", xp:12, color:"#84CC16" },
};

const TOPICS = {
  "tyt-mat": [
    "Sayı Basamakları","Bölme & Bölünebilme","Asal Sayılar & Asal Çarpanlara Ayırma",
    "EBOB & EKOK","Tam Sayılar","Rasyonel Sayılar","Ondalıklı Sayılar",
    "Üslü Sayılar","Köklü Sayılar","Oran & Orantı",
    "Denklem Çözme (1. Derece)","Denklem Sistemleri",
    "Eşitsizlikler","Mutlak Değer","Kümeler","Mantık","Fonksiyonlar (Temel)",
    "Problemler: Yaş","Problemler: Hız & Yol","Problemler: Yüzde & Faiz",
    "Sayma: Permütasyon & Kombinasyon","Olasılık (Temel)"
  ],
  "tyt-geo": [
    "Temel Kavramlar & Açılar","Üçgenler: İç & Dış Açılar","Özel Üçgenler",
    "Pisagor Teoremi","Dörtgenler & Paralelkenar","Çokgenler","Çember & Daire",
    "Katı Cisimler","Koordinat Geometrisi"
  ],
  "tyt-fen": [
    "Fizik: Ölçme & Birimler","Fizik: Kuvvet & Hareket","Fizik: Basınç","Fizik: Optik",
    "Kimya: Atom Yapısı","Kimya: Karışımlar","Kimya: Asit & Baz",
    "Biyoloji: Hücre Yapısı","Biyoloji: Kalıtım","Biyoloji: Ekosistem"
  ],
  "tyt-turk": [
    "Sözcükte Anlam","Cümlede Anlam","Paragraf: Ana Düşünce",
    "Dil Bilgisi: Yazım Kuralları","Dil Bilgisi: Noktalama İşaretleri","Ses Bilgisi"
  ],
  "tyt-sos": [
    "Tarih: İlk Türk Devletleri","Tarih: Kurtuluş Savaşı","Coğrafya: İklim",
    "Felsefe: Bilgi Felsefesi","Din Kültürü: Temel İbadetler"
  ],
  "ayt-mat": [
    "İkinci Dereceden Denklemler","Polinomlar","Fonksiyonlar","Trigonometri",
    "Logaritma","Diziler","Limit","Türev","İntegral","Karmaşık Sayılar"
  ],
  "ayt-geo": [
    "Üçgenlerde Sinüs & Kosinüs Teoremi","Analitik Geometri","Çemberin Analitiği",
    "Konikler: Parabol","Dönüşümler Geometrisi"
  ],
  "ayt-fiz": [
    "Vektörler & Kuvvet","Kinematik & Atışlar","Momentum & İmpuls",
    "Dairesel Hareket","Elektrik Alan & Potansiyel","Modern Fizik"
  ],
  "ayt-kim": [
    "Kuantum Model & Atom","Gazlar","Çözeltiler","Kimyasal Denge",
    "Elektrokimya","Organik Kimya"
  ],
  "ayt-bio": [
    "Hücre Metabolizması","Fotosentez & Solunum","Protein Sentezi",
    "İnsan Fizyolojisi (Sistemler)","Ekoloji"
  ]
};

const LEVELS=[
  {min:0,   name:"Çalışmaya Başladı", next:100},
  {min:100, name:"Azimli Öğrenci",    next:250},
  {min:250, name:"Kararlı Çalışan",   next:500},
  {min:500, name:"Net Avcısı",        next:900},
  {min:900, name:"YKS Savaşçısı",     next:1400},
  {min:1400,name:"Zirve Adayı",       next:2000},
  {min:2000,name:"Efsane Öğrenci",    next:99999},
];

let currentUser = null;
let userData = { done:{}, xp:0, streak:[], name:"", studySeconds:{}, exams:[] };
let activeSub = "tyt-mat";
let authMode = "login";
let saveTimeout = null;

function calcStats(){
  let tD=0,tT=0,aD=0,aT=0;
  Object.entries(TOPICS).forEach(([s,topics])=>{
    const isTyt=SUBJECTS[s].type==="tyt";
    topics.forEach((_,i)=>{
      if(isTyt){tT++; if(userData.done[s+":"+i])tD++;}
      else{aT++; if(userData.done[s+":"+i])aD++;}
    });
  });
  return{tD,tT,aD,aT,total:tD+aD,all:tT+aT};
}

function getLevel(xp){
  let lvl=LEVELS[0],idx=0;
  for(let i=LEVELS.length-1;i>=0;i--){ if(xp>=LEVELS[i].min){lvl=LEVELS[i];idx=i;break;} }
  const next=LEVELS[Math.min(idx+1,LEVELS.length-1)];
  const pct=idx===LEVELS.length-1?100:Math.round((xp-lvl.min)/(next.min-lvl.min)*100);
  return{lvl,idx,next,pct};
}

async function loadUserData(uid){
  const ref = doc(db,"users",uid);
  const snap = await getDoc(ref);
  if(snap.exists()){
    userData = { done:{}, xp:0, streak:[], name:"", studySeconds:{}, exams:[], ...snap.data() };
  } else {
    userData = { done:{}, xp:0, streak:[], name: currentUser.displayName||"", studySeconds:{}, exams:[] };
  }
}

function scheduleSave(){
  if(saveTimeout) clearTimeout(saveTimeout);
  const uid = currentUser?.uid;
  const snapshot = JSON.parse(JSON.stringify(userData));
  saveTimeout = setTimeout(async ()=>{
    if(!uid || !currentUser || currentUser.uid !== uid) return;
    await setDoc(doc(db,"users",uid), snapshot, {merge:true});
  }, 1000);
}

onAuthStateChanged(auth, async user=>{
  currentUser = user;
  if(user){
    showLoading("Veriler yükleniyor...");
    await loadUserData(user.uid);
    initMotivation();
    render();
  } else {
    render();
  }
});

function launchConfetti(){
  const colors=["#3b82f6","#f97316","#ffd60a","#10b981","#8b5cf6","#ec4899"];
  for(let i=0;i<40;i++){
    setTimeout(()=>{
      const el=document.createElement("div");
      const size=6+Math.random()*8;
      el.style.cssText=`position:fixed;width:${size}px;height:${size}px;border-radius:2px;
        left:${Math.random()*100}vw;top:-20px;z-index:9999;pointer-events:none;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        animation:cfFall ${2+Math.random()*2}s linear forwards;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),3000);
    },i*30);
  }
}

function showReward(emoji,title,text,xpAmt){
  const el=document.getElementById("rewardOverlay");
  document.getElementById("rEmoji").textContent=emoji;
  document.getElementById("rTitle").textContent=title;
  document.getElementById("rText").textContent=text;
  document.getElementById("rXP").textContent=`+${xpAmt} XP kazandın! 🎯`;
  el.style.opacity="1"; el.style.pointerEvents="all";
  el.querySelector(".rbox").style.transform="scale(1)";
  launchConfetti();
}

function showLoading(msg){
  document.getElementById("root").innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;">
      <div style="width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <div style="font-family:'JetBrains Mono',monospace;color:var(--text2);font-size:0.85rem;letter-spacing:1px;">${msg}</div>
    </div>`;
}

// ── AKSİYONLAR ──────────────────────────────────────────────
window.toggleTopic = function(subj, i){
  const key = subj + ":" + i;
  const wasDone = !!userData.done[key];
  userData.done[key] = !wasDone;
  
  const xpAmt = SUBJECTS[subj].xp;
  if(!wasDone){
    userData.xp += xpAmt;
    showReward("🎉", "Tebrikler!", `${SUBJECTS[subj].label} konusunu tamamladın.`, xpAmt);
  } else {
    userData.xp = Math.max(0, userData.xp - xpAmt);
  }
  scheduleSave();
  render();
};

window.setSub = function(s){
  activeSub = s;
  render();
};

window.logout = function(){
  signOut(auth);
};

window.toggleAuthMode = function(){
  authMode = authMode === 'login' ? 'register' : 'login';
  render();
};

window.doRegister = async function(){
  const name = document.getElementById("authName")?.value.trim();
  const email = document.getElementById("authEmail")?.value.trim();
  const pass = document.getElementById("authPass")?.value;
  const err = document.getElementById("authErr");
  if(!name || !email || !pass){ err.textContent="Lütfen tüm alanları doldur."; return; }
  err.textContent = "Kayıt yapılıyor...";
  try{
    const cred = await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(cred.user,{displayName:name});
    await setDoc(doc(db,"users",cred.user.uid), { done:{}, xp:0, streak:[], name:name });
  }catch(e){ err.textContent = e.message; }
};

window.doLogin = async function(){
  const email = document.getElementById("authEmail")?.value.trim();
  const pass = document.getElementById("authPass")?.value;
  const err = document.getElementById("authErr");
  if(!email || !pass){ err.textContent="Lütfen bilgileri gir."; return; }
  err.textContent = "Giriş yapılıyor...";
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){ err.textContent = "Giriş Başarısız: " + e.message; }
};

window.doForgotPassword = async function(){
  const email = document.getElementById("authEmail")?.value.trim();
  const err = document.getElementById("authErr");
  if(!email){ err.textContent="Şifre sıfırlama için e-posta girin."; return; }
  try{
    await sendPasswordResetEmail(auth, email);
    err.style.color = "#2ed573";
    err.textContent = "Sıfırlama bağlantısı e-posta adresinize gönderildi.";
  }catch(e){ err.textContent = e.message; }
};

// ── ANA RENDER FONKSİYONU ────────────────────────────────────
function render(){
  const root = document.getElementById("root");

  // Kullanıcı Giriş Yapmamışsa
  if(!currentUser){
    root.innerHTML = `
      <div style="max-width:400px;margin:80px auto;padding:24px;" class="card">
        <h2 style="margin-bottom:20px;text-align:center;font-weight:800;">YKSKoç Panel</h2>
        <div id="authErr" style="color:#ff4757;margin-bottom:12px;font-size:0.85rem;text-align:center;"></div>
        ${authMode==='register' ? '<input id="authName" class="input-field" placeholder="Ad Soyad" />' : ''}
        <input id="authEmail" class="input-field" type="email" placeholder="E-posta" />
        <input id="authPass" class="input-field" type="password" placeholder="Şifre" />
        <button class="btn-primary" style="width:100%;margin-top:8px;" onclick="${authMode==='register'?'doRegister()':'doLogin()'}">
          ${authMode==='register' ? 'Kayıt Ol' : 'Giriş Yap'}
        </button>
        <div style="margin-top:16px;display:flex;justify-between;font-size:0.85rem;color:var(--text2);">
          <span style="cursor:pointer;" onclick="toggleAuthMode()">
            ${authMode==='register' ? 'Giriş Yap' : 'Kayıt Ol'}
          </span>
          ${authMode==='login' ? '<span style="cursor:pointer;" onclick="doForgotPassword()">Şifremi Unuttum</span>' : ''}
        </div>
      </div>`;
    return;
  }

  // Kullanıcı Giriş Yapmışsa (Dashboard)
  const stats = calcStats();
  const levelInfo = getLevel(userData.xp);
  const currentTopics = TOPICS[activeSub] || [];

  const navTabs = Object.keys(SUBJECTS).map(s => `
    <button onclick="setSub('${s}')" class="tab-btn ${activeSub===s?'active':''}" style="${activeSub===s?`background:${SUBJECTS[s].color};border-color:${SUBJECTS[s].color}`:''}">
      ${SUBJECTS[s].label}
    </button>
  `).join('');

  const topicItems = currentTopics.map((t, i) => {
    const isDone = !!userData.done[activeSub+":"+i];
    return `
      <div class="topic-card ${isDone?'done':''}" onclick="toggleTopic('${activeSub}', ${i})">
        <span style="font-size:0.95rem;font-weight:600;">${t}</span>
        <div class="checkbox">${isDone?'✓':''}</div>
      </div>`;
  }).join('');

  root.innerHTML = `
    <div class="container">
      <!-- Üst Bilgi Barı -->
      <div class="header">
        <div>
          <h2 style="font-weight:800;font-size:1.4rem;">Hoş Geldin, ${userData.name || 'Öğrenci'} 👋</h2>
          <div style="font-size:0.85rem;color:var(--text2);margin-top:4px;">${levelInfo.lvl.name}</div>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <div style="text-align:right;">
            <div style="font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;color:#ffd60a;">${userData.xp} XP</div>
            <div style="font-size:0.75rem;color:var(--text3);">Seviye İlerlemesi %${levelInfo.pct}</div>
          </div>
          <button class="btn-primary" style="background:rgba(239,68,68,0.2);color:#ef4444;border:1px solid rgba(239,68,68,0.3);padding:8px 14px;" onclick="logout()">Çıkış</button>
        </div>
      </div>

      <!-- İstatistikler -->
      <div class="grid-2">
        <div class="card">
          <div style="font-size:0.85rem;color:var(--text2);font-weight:600;">TYT İlerlemesi</div>
          <div style="font-size:1.6rem;font-weight:800;margin:8px 0;color:#3b82f6;">${stats.tD} / ${stats.tT} Konu</div>
          <div style="height:6px;background:var(--bg3);border-radius:10px;overflow:hidden;">
            <div style="height:100%;width:${Math.round((stats.tD/stats.tT)*100||0)}%;background:#3b82f6;"></div>
          </div>
        </div>
        <div class="card">
          <div style="font-size:0.85rem;color:var(--text2);font-weight:600;">AYT İlerlemesi</div>
          <div style="font-size:1.6rem;font-weight:800;margin:8px 0;color:#ef4444;">${stats.aD} / ${stats.aT} Konu</div>
          <div style="height:6px;background:var(--bg3);border-radius:10px;overflow:hidden;">
            <div style="height:100%;width:${Math.round((stats.aD/stats.aT)*100||0)}%;background:#ef4444;"></div>
          </div>
        </div>
      </div>

      <!-- Dersler & Konu Listesi -->
      <div class="nav-tabs">${navTabs}</div>

      <div class="card">
        <div style="display:flex;justify-between;align-items:center;margin-bottom:16px;">
          <h3 style="color:${SUBJECTS[activeSub].color};font-weight:800;">${SUBJECTS[activeSub].label} Konu Takibi</h3>
          <span style="font-size:0.85rem;color:var(--text2);">Konu başı +${SUBJECTS[activeSub].xp} XP</span>
        </div>
        <div class="topic-list">${topicItems}</div>
      </div>
    </div>`;
}
</script>
</body>
</html>
