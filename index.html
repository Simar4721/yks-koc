<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YKSKoç — Takip Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#090d16;--bg2:#111827;--bg3:rgba(255,255,255,0.03);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#f3f4f6;--text2:#9ca3af;--text3:#6b7280;
  --accent:#3b82f6;--accent2:#f97316;--glow:rgba(59,130,246,0.15);
}
body.light{
  --bg:#f8fafc;--bg2:#ffffff;--bg3:rgba(0,0,0,0.02);
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.12);
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --glow:rgba(59,130,246,0.08);
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;transition:background 0.3s,color 0.3s;
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 24px 24px;
}
#root{position:relative;z-index:1;}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cfFall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes popIn{from{transform:translateY(20px) scale(0.95);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px;}

.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
.input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); padding: 12px; border-radius: 10px; color: var(--text); margin-bottom: 12px; }

#motivationPopup {
  position: fixed; bottom: 24px; right: 24px; z-index: 900;
  max-width: 340px; width: calc(100% - 48px);
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 16px; padding: 20px;
  box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); backdrop-filter: blur(12px); animation: popIn 0.4s ease;
  display: flex; flex-direction: column; gap: 10px;
}
#motivationPopup.hidden { display: none; }
.popup-header { display: flex; justify-content: space-between; align-items: center; }
.popup-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; }
.popup-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1.1rem; }
.popup-body { font-size: 0.92rem; color: var(--text); line-height: 1.5; font-weight: 500; }
.topic-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.topic-item:hover { background: var(--bg3); }
</style>
</head>
<body>
<div id="root"></div>

<div id="motivationPopup">
  <div class="popup-header">
    <span class="popup-title">⚡ Günün Motivasyonu</span>
    <button class="popup-close" onclick="closeMotivation()">✕</button>
  </div>
  <div class="popup-body" id="motivationText">...</div>
</div>

<div id="rewardOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(8px);">
  <div class="rbox" style="background:var(--bg2);border:1px solid #ffd60a;border-radius:24px;padding:40px;text-align:center;max-width:400px;width:90%;transform:scale(0.8);transition:transform 0.3s;">
    <div id="rEmoji" style="font-size:3.5rem;margin-bottom:12px;">🎉</div>
    <div id="rTitle" style="font-size:1.5rem;font-weight:800;color:#ffd60a;margin-bottom:8px;">HARİKA!</div>
    <div id="rText" style="color:var(--text2);font-size:0.95rem;line-height:1.6;margin-bottom:16px;"></div>
    <div id="rXP" style="font-family:'JetBrains Mono',monospace;font-size:1.1rem;color:#2ed573;margin-bottom:24px;"></div>
    <button id="rewardBtn" onclick="closeReward()" style="background:#ffd60a;border:none;color:#000;padding:12px 32px;border-radius:12px;font-weight:800;cursor:pointer;font-size:0.9rem;width:100%;">DEVAM ET 💪</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, browserSessionPersistence, setPersistence, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTcsGoXARld4-IQpzst-27bNzzHTJMGbU",
  authDomain: "ykskoc47.firebaseapp.com",
  projectId: "ykskoc47",
  storageBucket: "ykskoc47.firebasestorage.app",
  messagingSenderId: "950563682553",
  appId: "1:950563682553:web:941c5c6b8d0a7a10134a28"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserSessionPersistence).catch(()=>{});

const MOTIVATION_QUOTES = [
  "Vazgeçmediğin sürece kaybetmezsin.",
  "Gelecek, bugünden hazırlananlara aittir.",
  "Bugün yapacağın ekstra bir saatlik çalışma, yarınki farkını yaratacak.",
  "Zorluklar, başarının değerini artıran süslerdir.",
  "Disiplin, ne istediğin ile en çok ne istediğin arasında seçim yapmaktır.",
  "Başarı, her gün tekrarlanan küçük çabaların toplamıdır."
];

function initMotivation(){
  const quote = MOTIVATION_QUOTES[Math.floor(Math.random() * MOTIVATION_QUOTES.length)];
  const el = document.getElementById("motivationText");
  if(el) el.textContent = `"${quote}"`;
}
window.closeMotivation = function(){ document.getElementById("motivationPopup")?.classList.add("hidden"); };
window.closeReward = function(){
  const el=document.getElementById("rewardOverlay");
  el.style.opacity="0"; el.style.pointerEvents="none";
};

const SUBJECTS = {
  "tyt-mat":  { label:"TYT Matematik",  type:"tyt", xp:10, color:"#3b82f6" },
  "tyt-geo":  { label:"TYT Geometri",   type:"tyt", xp:10, color:"#0EA5E9" },
  "tyt-fen":  { label:"TYT Fen",        type:"tyt", xp:10, color:"#10B981" },
  "tyt-turk": { label:"TYT Türkçe",     type:"tyt", xp:10, color:"#8B5CF6" },
  "tyt-sos":  { label:"TYT Sosyal",     type:"tyt", xp:8,  color:"#F59E0B" },
  "ayt-mat":  { label:"AYT Matematik",  type:"ayt", xp:15, color:"#EF4444" },
  "ayt-geo":  { label:"AYT Geometri",   type:"ayt", xp:15, color:"#F97316" },
  "ayt-fiz":  { label:"AYT Fizik",      type:"ayt", xp:15, color:"#EC4899" },
  "ayt-kim":  { label:"AYT Kimya",      type:"ayt", xp:15, color:"#F43F5E" },
  "ayt-bio":  { label:"AYT Biyoloji",   type:"ayt", xp:12, color:"#84CC16" },
};

const TOPICS = {
  "tyt-mat": ["Sayı Basamakları","Bölme & Bölünebilme","Asal Sayılar","Üslü Sayılar","Köklü Sayılar","Denklem Çözme","Kümeler","Fonksiyonlar","Problemler","Olasılık"],
  "tyt-geo": ["Açılar","Üçgenler","Özel Üçgenler","Dörtgenler","Çokgenler","Çember & Daire","Katı Cisimler","Analitik Geometri"],
  "tyt-fen": ["Fizik: Kuvvet & Hareket","Fizik: Optik","Kimya: Atom Yapısı","Kimya: Karışımlar","Biyoloji: Hücre","Biyoloji: Kalıtım"],
  "tyt-turk": ["Sözcükte Anlam","Cümlede Anlam","Paragraf","Dil Bilgisi","Yazım Kuralları","Noktalama İşaretleri"],
  "tyt-sos": ["Tarih: İlk Türk Devletleri","Tarih: Kurtuluş Savaşı","Coğrafya: İklim","Felsefe: Bilgi Felsefesi","Din Kültürü"],
  "ayt-mat": ["Polinomlar","İkinci Dereceden Denklemler","Trigonometri","Logaritma","Diziler","Limit","Türev","İntegral"],
  "ayt-geo": ["Üçgenler","Analitik Geometri","Çemberin Analitiği","Dönüşümler","Katı Cisimler"],
  "ayt-fiz": ["Vektörler","Atışlar","İş Enerji","Elektrik Alan","Optik","Modern Fizik"],
  "ayt-kim": ["Atom ve Kuantum","Gazlar","Çözeltiler","Kimyasal Denge","Elektrokimya","Organik Kimya"],
  "ayt-bio": ["Nükleik Asitler","Protein Sentezi","Sistemler","Fotosentez","Hücresel Solunum","Ekoloji"]
};

let currentUser = null;
let userData = { done:{}, xp:0, streak:[], name:"", studySeconds:{}, exams:[] };
let activeSub = "tyt-mat";
let authMode = "login";

async function loadUserData(uid){
  const ref = doc(db,"users",uid);
  const snap = await getDoc(ref);
  if(snap.exists()){
    userData = { done:{}, xp:0, streak:[], name:"", studySeconds:{}, exams:[], ...snap.data() };
  } else {
    userData = { done:{}, xp:0, streak:[], name: currentUser.displayName||"", studySeconds:{}, exams:[] };
  }
}

function scheduleSave(){
  const uid = currentUser?.uid;
  if(!uid) return;
  setDoc(doc(db,"users",uid), JSON.parse(JSON.stringify(userData)), {merge:true});
}

onAuthStateChanged(auth, async user=>{
  currentUser = user;
  if(user){
    await loadUserData(user.uid);
    initMotivation();
    renderDashboard();
  } else {
    renderAuth();
  }
});

function toggleTopic(subj, i){
  const key = subj + ":" + i;
  userData.done[key] = !userData.done[key];
  if(userData.done[key]) userData.xp += SUBJECTS[subj].xp;
  else userData.xp = Math.max(0, userData.xp - SUBJECTS[subj].xp);
  scheduleSave();
  renderDashboard();
}

window.setSub = function(s){
  activeSub = s;
  renderDashboard();
};

window.logout = function(){ signOut(auth); };

function renderAuth(){
  document.getElementById("root").innerHTML = `
    <div style="max-width:400px;margin:80px auto;padding:24px;" class="card">
      <h2 style="margin-bottom:20px;text-align:center;">YKSKoç Giriş</h2>
      <div id="authErr" style="color:#ff4757;margin-bottom:10px;font-size:0.85rem;"></div>
      ${authMode==='register'?'<input id="authName" class="input" placeholder="Ad Soyad" />':''}
      <input id="authEmail" class="input" type="email" placeholder="E-posta" />
      <input id="authPass" class="input" type="password" placeholder="Şifre" />
      <button class="btn" style="width:100%;" onclick="${authMode==='register'?'doRegister()':'doLogin()'}">${authMode==='register'?'Kayıt Ol':'Giriş Yap'}</button>
      <div style="margin-top:16px;text-align:center;font-size:0.85rem;color:var(--text2);cursor:pointer;" onclick="toggleAuthMode()">
        ${authMode==='register'?'Zaten hesabın var mı? Giriş Yap':'Hesabın yok mu? Kayıt Ol'}
      </div>
    </div>`;
}

window.toggleAuthMode = function(){
  authMode = authMode==='register'?'login':'register';
  renderAuth();
};

window.doRegister = async function(){
  const name = document.getElementById("authName")?.value.trim();
  const email = document.getElementById("authEmail")?.value.trim();
  const pass = document.getElementById("authPass")?.value;
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, {displayName: name});
    await setDoc(doc(db,"users",cred.user.uid), { done:{}, xp:0, streak:[], name: name });
  } catch(e) { document.getElementById("authErr").textContent = e.message; }
};

window.doLogin = async function(){
  const email = document.getElementById("authEmail")?.value.trim();
  const pass = document.getElementById("authPass")?.value;
  try { await signInWithEmailAndPassword(auth, email, pass); } 
  catch(e) { document.getElementById("authErr").textContent = "Giriş Başarısız: " + e.message; }
};

function renderDashboard(){
  const topics = TOPICS[activeSub] || [];
  let topicsHTML = topics.map((t, i)=>{
    const isDone = !!userData.done[activeSub+":"+i];
    return `
      <div class="topic-item" onclick="toggleTopic('${activeSub}', ${i})">
        <input type="checkbox" ${isDone?'checked':''} readonly />
        <span style="${isDone?'text-decoration:line-through;opacity:0.6;':''}">${t}</span>
      </div>`;
  }).join('');

  let tabsHTML = Object.keys(SUBJECTS).map(s=>`
    <button onclick="setSub('${s}')" class="btn" style="background:${activeSub===s?SUBJECTS[s].color:'transparent'};border:1px solid ${SUBJECTS[s].color};padding:6px 12px;font-size:0.8rem;margin:2px;">
      ${SUBJECTS[s].label}
    </button>
  `).join('');

  document.getElementById("root").innerHTML = `
    <div style="max-width:900px;margin:0 auto;padding:24px;">
      <div style="display:flex;justify-between;align-items:center;margin-bottom:24px;">
        <h2>Hoş Geldin, ${userData.name || 'Öğrenci'} 👋</h2>
        <div>
          <span style="margin-right:16px;font-weight:700;color:#ffd60a;">XP: ${userData.xp}</span>
          <button class="btn" style="background:#ff4757;" onclick="logout()">Çıkış</button>
        </div>
      </div>
      <div style="margin-bottom:16px;">${tabsHTML}</div>
      <div class="card">
        <h3 style="margin-bottom:16px;color:${SUBJECTS[activeSub].color}">${SUBJECTS[activeSub].label} Konuları</h3>
        <div>${topicsHTML}</div>
      </div>
    </div>`;
}
</script>
</body>
</html>
